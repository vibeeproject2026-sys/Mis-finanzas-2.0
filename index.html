<script>
  (() => {
    const removeGeminiKeyUI = () => {
      const geminiInput = document.getElementById('gemini-key-input');
      if (geminiInput) {
        const box = geminiInput.closest('.data-box');
        if (box) box.remove();
      }

      const labels = Array.from(document.querySelectorAll('*'));
      for (const el of labels) {
        if (el && el.textContent && el.textContent.includes('Clave de API de Gemini')) {
          const nearestBox = el.closest('.data-box');
          if (nearestBox) nearestBox.remove();
        }
      }
    };

    removeGeminiKeyUI();

    const observer = new MutationObserver(() => {
      removeGeminiKeyUI();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  })();
</script>
