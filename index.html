<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Terminal Cloud</title>

  <!-- =========================================================
       ESTILOS
       v=20260916-0300 fuerza al navegador a descargar
       la versión actual y evita usar archivos antiguos en caché.
       ========================================================= -->

  <link
    rel="stylesheet"
    href="./css/variables.css?v=20260916-0300"
  >

  <link
    rel="stylesheet"
    href="./css/main.css?v=20260916-0300"
  >

  <style>

    /* =========================================================
       CONTROL DE SCROLL Y MÁRGENES
       ========================================================= */

    html,
    body {
      overflow-x: hidden !important;
      width: 100%;
      max-width: 100vw;
      position: relative;
      touch-action: pan-y;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* =========================================================
       CONTENEDOR PRINCIPAL
       ========================================================= */

    #view {
      width: 100%;
      box-sizing: border-box;
      padding-left: 16px;
      padding-right: 16px;
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      width: 100%;
      box-sizing: border-box;
      margin-left: 0;
      margin-right: 0;
    }

    /* =========================================================
       SCROLLBAR
       ========================================================= */

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
    }

    /* =========================================================
       ELEMENTOS OCULTOS DEL MODO SAAS
       ========================================================= */

    button[data-action="export-backup"],
    button[data-action="import-backup"],
    button[data-action="reset-data"] {
      display: none !important;
    }

  </style>
</head>

<body>

  <!-- =========================================================
       CONTENIDO PRINCIPAL
       ========================================================= -->

  <div id="view"></div>

  <!-- =========================================================
       NAVEGACIÓN INFERIOR
       ========================================================= -->

  <nav
    id="tabbar"
    class="tabbar"
  ></nav>

  <!-- =========================================================
       CAPA DE MODALES / OVERLAYS
       ========================================================= -->

  <div id="overlays"></div>

  <!-- =========================================================
       INPUT PARA IMPORTACIÓN DE BACKUP
       ========================================================= -->

  <input
    type="file"
    id="import-file"
    style="display:none"
    accept=".json"
  >

  <!-- =========================================================
       INPUT GLOBAL PARA CÁMARA / FACTURAS
       ========================================================= -->

  <input
    type="file"
    id="global-camera-input"
    style="display:none"
    accept="image/*"
    capture="environment"
  >

  <!-- =========================================================
       APLICACIÓN

       IMPORTANTE:
       El parámetro ?v=20260916-0300 obliga al navegador a
       descargar nuevamente app.js en lugar de reutilizar
       una copia antigua almacenada en caché.
       ========================================================= -->

  <script
    type="module"
    src="./js/app.js?v=20260916-0300"
  ></script>

</body>
</html>
