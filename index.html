<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terminal Cloud</title>
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
  <style>
    /* Bloqueo total de scroll horizontal y control estricto de la barra lateral */
    html, body {
      overflow-x: hidden !important;
      width: 100%;
      max-width: 100vw;
      position: relative;
      touch-action: pan-y; /* Solo permite desplazamiento vertical en táctil */
    }
    
    /* Barra de desplazamiento elegante, delgada y contenida */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <nav id="tabbar" class="tabbar"></nav>
  <div id="overlays"></div>
  <input type="file" id="import-file" style="display:none" accept=".json">
  <input type="file" id="global-camera-input" style="display:none" accept="image/*" capture="environment">

  <script type="module" src="./js/app.js"></script>
</body>
</html>
