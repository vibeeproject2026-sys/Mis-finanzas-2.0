<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Mis Finanzas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<meta name="theme-color" content="#7C5CFC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8F7FC; --card:#FFFFFF; --card-alt:#F1EEFA;
    --ink:#211B36; --ink-muted:#8B85A3; --line:#E7E2F2;
    --violet:#7053E8; --violet-dark:#5D40D2; --pink:#FF6FA5;
    --income:#16A34A; --income-bg:#DCFCE7;
    --income2:#0EA5A5; --income2-bg:#D9F5F3;
    --expense:#F14E4E; --expense-bg:#FFE4E4;
    --amber:#F5A623; --amber-bg:#FFF2DA;
    --shadow: 0 7px 24px rgba(55,42,100,0.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;height:100%;}
  #root{max-width:480px;margin:0 auto;height:100dvh;height:100vh;position:relative;display:flex;flex-direction:column;}
  #view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 1rem 8rem;}
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;user-select:none;-webkit-user-select:none;}
  input{font-family:inherit;}
  .icon{width:1em;height:1em;display:inline-block;vertical-align:middle;}
  .icon svg{width:100%;height:100%;}

  .hero{
    position:relative;
    margin:0 -1rem 1.25rem;
    padding:2.2rem 1.4rem 1.8rem;
    background:
      radial-gradient(circle at 85% 15%, rgba(255, 111, 165, 0.38) 0%, transparent 55%),
      radial-gradient(circle at 10% 85%, rgba(112, 83, 232, 0.45) 0%, transparent 60%),
      linear-gradient(135deg, #261742 0%, #5135A3 45%, #7C5CFC 100%);
    border-radius:0 0 32px 32px;
    color:#fff;
    box-shadow:0 12px 32px rgba(81, 53, 163, 0.28);
    overflow:hidden;
  }
  .hero::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:url("data:image/svg+xml,%3Csvg width='24' height='24' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='3' cy='3' r='1.5' fill='%23ffffff' fill-opacity='0.12'/%3E%3C/svg%3E");
    pointer-events:none;
  }
  .hero::after{
    content:'';
    position:absolute;
    top:-40px;
    right:-40px;
    width:150px;
    height:150px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    filter:blur(20px);
    pointer-events:none;
  }
  .hero-content{position:relative;z-index:2;}
  .hero-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.14);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:4px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    border:1px solid rgba(255,255,255,0.22);
    margin-bottom:12px;
  }
  .hero-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#4ADE80;
    box-shadow:0 0 8px #4ADE80;
  }
  .hero-main{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .hero h1{
    font-family: 'Outfit', system-ui, sans-serif;
    font-size:26px;
    font-weight:700;
    letter-spacing:-.035em;
    line-height:1.15;
    background: linear-gradient(180deg, #FFFFFF 25%, #F0E6FF 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.18));
  }
  .hero p{
    font-family: 'Outfit', sans-serif;
    font-size:13px;
    opacity:.9;
    margin-top:5px;
    font-weight:400;
    line-height:1.35;
    color: #E2D9F3;
  }
  .hero-avatar{
    width:50px;
    height:50px;
    border-radius:18px;
    background:rgba(255,255,255,0.16);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1.5px solid rgba(255,255,255,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    flex-shrink:0;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
  }

  .banner{margin:0 0 .75rem;font-size:.75rem;border-radius:14px;padding:.65rem .8rem;}
  .banner--warn{background:var(--expense-bg);color:var(--expense);}

  .section-title{font-size:15px;font-weight:800;margin-bottom:10px;letter-spacing:-.01em;}
  .empty-hint{font-size:12.5px;color:var(--ink-muted);padding:.4rem 0;}

  .balance-card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);border:1px solid rgba(231,226,242,.65);margin-bottom:16px;}
  .balance-label{color:var(--ink-muted);font-size:13px;font-weight:650;}
  .balance-amount{font-size:38px;font-weight:850;letter-spacing:-.035em;margin-top:2px;}
  .balance-month{color:var(--ink-muted);font-size:12px;text-transform:capitalize;margin-top:2px;}

  .balance-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .b-metric{display:flex;flex-direction:column;gap:2px;}
  .b-metric .lbl{font-size:11px;color:var(--ink-muted);font-weight:700;}
  .b-metric .val{font-size:14px;font-weight:800;}
  .b-metric .val.inc{color:var(--income);}
  .b-metric .val.exp{color:var(--expense);}
  .b-metric .val.sav{color:var(--violet);}

  .quick-grid{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px;justify-content:center;}
  .quick-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    width:82px;
    padding:11px 4px 10px;
    border-radius:18px;
    background:var(--card);
    box-shadow:var(--shadow);
    border:1px solid rgba(231,226,242,.65);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .quick-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .quick-btn:hover {
    transform: translateY(-3px) scale(1.04);
  }
  .quick-btn:active {
    transform: scale(0.92);
  }
  .quick-btn:active::after {
    opacity: 1;
  }
  .quick-btn .em{font-size:24px; transition: transform 0.2s ease;}
  .quick-btn:hover .em{transform: scale(1.12) rotate(-3deg);}
  .quick-btn .nm{
    font-size:9.8px;
    font-weight:700;
    text-align:center;
    line-height:1.2;
    white-space:normal;
    word-break:break-word;
    max-width:100%;
    padding:0 2px;
  }

  .card{border-radius:22px;padding:17px;background:var(--card);box-shadow:var(--shadow);margin-bottom:14px;border:1px solid rgba(231,226,242,.55);}

  .burn-card{background:var(--card-alt);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
  .burn-info{display:flex;flex-direction:column;gap:2px;}
  .burn-lbl{font-size:11px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;}
  .burn-val{font-size:20px;font-weight:850;letter-spacing:-.02em;}
  .burn-status{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;}
  .burn-status.ok{background:var(--income-bg);color:var(--income);}
  .burn-status.warn{background:var(--amber-bg);color:var(--amber);}
  .burn-status.alert{background:var(--expense-bg);color:var(--expense);}

  .runway-card{background:linear-gradient(135deg, #211B36, #3B2D63);color:#fff;border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;margin-top:8px;}
  .runway-icon{font-size:26px;background:rgba(255,255,255,0.1);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .runway-main{flex:1;}
  .runway-lbl{font-size:10.5px;opacity:0.8;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .runway-val{font-size:14px;font-weight:800;margin-top:1px;}
  .runway-val span{color:var(--pink);font-size:16px;}

  .cat-row{margin-bottom:12px;}
  .cat-row .top{display:flex;justify-content:space-between;font-size:12.5px;}
  .cat-row .sub-info{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-muted);margin-top:2px;}
  .bar-track{height:9px;border-radius:999px;background:var(--card-alt);margin-top:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;transition:width 0.3s ease;}

  .pie-layout{display:flex;align-items:center;gap:18px;padding:5px 0 2px;}
  .pie-chart{width:140px;height:140px;flex:0 0 140px;position:relative;overflow:hidden;}
  .pie-chart svg{width:100%;height:100%;display:block;overflow:visible;}
  .pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;}
  .pie-center strong{font-size:18px;font-weight:850;color:var(--ink);line-height:1.1;letter-spacing:-0.02em;}
  .pie-center span{font-size:9.5px;color:var(--ink-muted);margin-top:3px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .pie-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;}
  .pie-legend-row{display:flex;align-items:center;gap:7px;min-width:0;}
  .pie-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;}
  .pie-name{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .pie-pct{font-size:11.5px;font-weight:800;flex-shrink:0;}

  /* ===== Comparativa Mes a Mes - Carrusel ===== */
  .mom-card{
    background:linear-gradient(135deg, #FFFFFF 0%, #F5F2FF 100%);
    border-radius:20px;
    padding:16px;
    border:1px solid #E2D9F3;
    margin-top:14px;
    overflow:hidden;
  }
  .mom-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .mom-title{font-size:13.5px;font-weight:800;color:var(--ink);}
  .mom-dots{display:flex;gap:5px;}
  .mom-dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s;}
  .mom-dot.active{background:var(--violet);}
  .mom-carousel{position:relative;height:108px;overflow:hidden;}
  .mom-track{
    display:flex;
    transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);
    height:100%;
  }
  .mom-slide{
    min-width:100%;
    padding:0 2px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .mom-slide-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mom-box{background:#fff;padding:11px 12px;border-radius:14px;border:1px solid rgba(231,226,242,.85);}
  .mom-box .lbl{font-size:10px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .mom-box .val{font-size:14px;font-weight:850;margin-top:3px;}
  .mom-box .delta{font-size:11px;font-weight:700;margin-top:2px;}
  .mom-box .delta.up{color:var(--expense);}
  .mom-box .delta.down{color:var(--income);}
  .mom-box .delta.neutral{color:var(--ink-muted);}
  .mom-single{background:#fff;padding:14px;border-radius:14px;border:1px solid rgba(231,226,242,.85);text-align:center;}
  .mom-single .lbl{font-size:11px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;}
  .mom-single .val{font-size:22px;font-weight:850;margin-top:4px;}
  .mom-single .sub{font-size:12px;color:var(--ink-muted);margin-top:3px;}
  .mom-insight{background:var(--amber-bg);border-radius:12px;padding:10px;font-size:11.5px;color:#8A5B00;line-height:1.35;display:flex;gap:8px;align-items:flex-start;margin-top:12px;}

  .search-box{display:flex;align-items:center;gap:8px;border-radius:16px;padding:11px 14px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px;border:1px solid rgba(231,226,242,.55);}
  .search-box input{flex:1;border:none;background:transparent;outline:none;font-size:13.5px;color:var(--ink);}

  .filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .chip{padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--card);color:var(--ink-muted);box-shadow:var(--shadow);}
  .chip.selected{background:var(--violet);color:#fff;box-shadow:none;}

  .tx-item, .cat-item{width:100%;display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px;background:var(--card);box-shadow:var(--shadow);text-align:left;margin-bottom:9px;border:1px solid rgba(231,226,242,.5);}
  .avatar{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:19px;}
  .tx-main{flex:1;min-width:0;}
  .tx-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-sub{font-size:11.5px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tx-amount{font-size:14px;font-weight:800;flex-shrink:0;}
  .tx-amount.income{color:var(--income);}
  .tx-amount.expense{color:var(--expense);}
  .empty-state{text-align:center;padding:3rem 0;color:var(--ink-muted);font-size:13px;}

  .new-cat-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:18px;padding:14px;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;font-size:13.5px;font-weight:800;margin-bottom:18px;box-shadow:var(--shadow);}
  .cat-item .cat-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:5px;}
  .cat-item .cat-budget{font-size:11px;color:var(--ink-muted);}
  .cat-item .cat-total{font-size:12.5px;font-weight:700;color:var(--ink-muted);margin-right:2px;}
  .star-badge{font-size:10px;background:var(--amber-bg);color:var(--amber);padding:2px 6px;border-radius:999px;font-weight:800;}
  .fixed-badge{font-size:10px;background:var(--card-alt);color:var(--violet);padding:2px 6px;border-radius:999px;font-weight:800;}

  .credit-card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid rgba(231,226,242,.65);}
  .credit-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .credit-title{font-size:15px;font-weight:800;}
  .credit-sub{font-size:11.5px;color:var(--ink-muted);margin-top:2px;}
  .credit-values{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 4px;font-size:12.5px;}
  .credit-pending{font-weight:850;font-size:16px;}
  .credit-pending.against{color:var(--expense);}
  .credit-pending.favor{color:var(--income);}
  .payment-item{display:flex;justify-content:space-between;align-items:center;background:var(--card-alt);padding:8px 12px;border-radius:12px;font-size:12px;margin-top:6px;}
  .add-pay-btn{width:100%;padding:8px;border-radius:12px;background:var(--card-alt);color:var(--violet);font-weight:700;font-size:12px;margin-top:10px;text-align:center;}

  .settings-list{border-radius:18px;padding:5px;background:var(--card);box-shadow:var(--shadow);}
  .settings-row{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border-radius:14px;font-size:13.5px;}
  .settings-row.active{background:var(--card-alt);}
  .data-box{border-radius:18px;padding:15px;background:var(--card);box-shadow:var(--shadow);font-size:13px;}
  .data-box .row{display:flex;justify-content:space-between;padding:2px 0;}
  .data-box .row .muted{color:var(--ink-muted);}
  .danger-btn{width:100%;border-radius:18px;padding:13px;font-size:13.5px;font-weight:700;background:var(--expense-bg);color:var(--expense);margin-top:8px;}
  .secondary-btn{width:100%;border-radius:18px;padding:13px;font-size:13.5px;font-weight:700;background:var(--card);box-shadow:var(--shadow);margin-top:8px;}

  #fab-slot{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(76px + env(safe-area-inset-bottom));pointer-events:none;z-index:100;}
  .fab{position:absolute;right:16px;bottom:0;width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(124,92,252,.4);pointer-events:auto;border:3px solid rgba(255,255,255,.9);}
  .fab:active{transform:scale(.94);}

  .tabbar{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    z-index:90;
    display:flex;
    justify-content:space-around;
    align-items:center;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding-top:.6rem;
    padding-bottom:max(.85rem, env(safe-area-inset-bottom));
  }
  .tab-btn{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;color:var(--ink-muted);}
  .tab-btn.active{color:var(--violet);}
  .tab-btn .icon{width:22px;height:22px;}
  .tab-btn span{font-size:10px;}
  .tab-btn.active span{font-weight:800;}

  .overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;background:rgba(33,27,54,.45);}
  .overlay-center{align-items:center;padding:1.5rem;}
  .sheet{width:100%;max-width:480px;background:var(--bg);border-radius:26px 26px 0 0;padding:1.25rem;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:max(1.5rem, env(safe-area-inset-bottom));}
  .sheet-handle{width:36px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 12px;}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .sheet-head h3{font-size:17px;font-weight:800;}

  .field{margin-bottom:16px;}
  .field-label{font-size:11.5px;font-weight:700;color:var(--ink-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .field input, .field select{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:16px;color:var(--ink);outline:none;}
  .field input:focus{border-color:var(--violet);}

  .type-toggle{display:flex;border-radius:14px;padding:4px;background:var(--card-alt);margin-bottom:16px;}
  .type-toggle button{flex:1;padding:10px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--ink-muted);}
  .type-toggle button.active-expense{background:var(--expense);color:#fff;}
  .type-toggle button.active-income{background:var(--income);color:#fff;}
  .type-toggle button.active-neutral{background:var(--violet);color:#fff;}

  .chip-wrap{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .pick-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 14px 8px 8px;
    border-radius:18px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    user-select:none;
  }
  .pick-chip:active{transform:scale(0.95);}
  .pick-chip .chip-icon{
    width:32px;
    height:32px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    transition:all 0.2s ease;
    flex-shrink:0;
  }
  .pick-chip .chip-label{
    white-space:nowrap;
    letter-spacing:-0.01em;
  }

  .swatch{width:32px;height:32px;border-radius:999px;border:3px solid transparent;}
  .swatch.selected{border-color:var(--ink);}
  .emoji-btn{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--card);border:1.5px solid var(--line);}

<script>
const STORAGE_KEY = 'finanzas_app_v2';

const SWATCHES = ['#7C5CFC','#F14E4E','#F5A623','#16A34A','#0EA5A5','#FF6FA5','#3B82F6','#A855F7','#EAB308','#64748B'];
const ICON_KEYS = ['food','transport','home','zap','heart','fun','shopping','briefcase','dollarSign','more'];
const ICON_EMOJI = {food:'🍔',transport:'🚗',home:'🏠',zap:'💡',heart:'❤',fun:'🎬',shopping:'🛍',briefcase:'💼',dollarSign:'💵',more:'⭐'};

const DEFAULT_CATEGORIES = [
  {id:'inc-salary',name:'Salario',type:'income',color:'#16A34A',icon:'briefcase',primary:true},
  {id:'inc-sales',name:'Ventas',type:'income',color:'#0EA5A5',icon:'dollarSign',primary:false},

  {id:'exp-health',name:'Salud',type:'expense',color:'#FF6FA5',icon:'heart',budget:null,isFixed:false},

  {id:'exp-other',name:'Otros gastos',type:'expense',color:'#64748B',icon:'more',budget:null,isFixed:false},

const CURRENCIES = {
  COP:{locale:'es-CO',label:'Peso colombiano (COP)'},
  USD:{locale:'en-US',label:'Dólar (USD)'},
  MXN:{locale:'es-MX',label:'Peso mexicano (MXN)'},
  EUR:{locale:'es-ES',label:'Euro (EUR)'},
};

let storageOk = true;
try { localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); } catch(e) { storageOk = false; }

function loadDB(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Normalización fuerte de montos para evitar NaN / strings que resetean a 0
      const txs = (parsed.transactions || []).map(t => ({
        ...t,
        amount: Number(t.amount) || 0,
        date: (t.date && typeof t.date === 'string') ? t.date : todayStr()
      }));
      const credits = (parsed.credits || []).map(c => ({
        ...c,
        total: Number(c.total) || 0,
        payments: (c.payments || []).map(p => ({
          ...p,
          amount: Number(p.amount) || 0
        }))
      }));
      const invoices = (parsed.invoices || []).map(inv => ({
        ...inv,
        total: Number(inv.total) || 0,
        items: (inv.items || []).map(it => ({...it, price: Number(it.price) || 0}))
      }));
      return {
        transactions: txs,
        categories: (parsed.categories && parsed.categories.length) ? parsed.categories : DEFAULT_CATEGORIES.slice(),
        credits: credits,
        invoices: invoices,
        settings: parsed.settings || {currency:'COP'},
      };
    }
  } catch(e){}
  return {transactions:[], categories:DEFAULT_CATEGORIES.slice(), credits:[], invoices:[], settings:{currency:'COP'}};
}

function saveDB(){
  if (!storageOk) return;
  try {
    // Aseguramos que los montos se guarden siempre como números
    const clean = {
      transactions: DB.transactions.map(t => ({...t, amount: Number(t.amount) || 0})),
      categories: DB.categories,
      credits: (DB.credits || []).map(c => ({
        ...c,
        total: Number(c.total) || 0,
        payments: (c.payments || []).map(p => ({...p, amount: Number(p.amount) || 0}))
      })),
      invoices: (DB.invoices || []).map(inv => ({
        ...inv,
        total: Number(inv.total) || 0,
        items: (inv.items || []).map(it => ({...it, price: Number(it.price) || 0}))
      })),
      settings: DB.settings
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clean));
  } catch(e){ storageOk = false; render(); }
}

let DB = loadDB();
let UI = {tab:'dashboard', txFilter:'all', creditFilter:'against', search:'', openInvoiceId:null};
let sheet = null;
let confirmState = null;
let scanningOverlay = null;
let momSlideIndex = 0;
let momInterval = null;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function todayStr(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function formatThousandInput(val){
  const digits = String(val).replace(/\D/g, '');
  if (!digits) return '';
  return new Intl.NumberFormat('es-CO').format(digits);
}

function parseFormattedNumber(val){
  if (!val) return '';
  return String(val).replace(/\D/g, '');
}

function fmtMoney(amount){
  const cur = DB.settings.currency || 'COP';
  const cfg = CURRENCIES[cur] || CURRENCIES.COP;
  const n = Number(amount) || 0;
  try { return new Intl.NumberFormat(cfg.locale, {style:'currency', currency:cur, maximumFractionDigits:0}).format(n); }
  catch(e){ return n.toFixed(0) + ' ' + cur; }
}

function monthLabelStr(date){ return new Intl.DateTimeFormat('es-CO', {month:'long', year:'numeric'}).format(date); }
function catById(id){ return DB.categories.find(c => c.id === id); }
function getPrimaryIncomeCat(){ return DB.categories.find(c => c.type==='income' && c.primary) || null; }

const ICONS = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="4 12 9 17 20 6"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><line x1="16" y1="16" x2="21" y2="21"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 2 20h20L12 3z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17" r="0.8" fill="currentColor" stroke="none"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="17" cy="14" r="1.3" fill="currentColor" stroke="none"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3h6a2 2 0 0 1 2 2v6a2 2 0 0 1-.6 1.4l-8 8a2 2 0 0 1-2.8 0l-6-6a2 2 0 0 1 0-2.8l8-8A2 2 0 0 1 12 3z"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  credit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>',
  receipt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2v20l2-1.5L10 22l2-1.5L14 22l2-1.5L18 22V2l-2 1.5L14 2l-2 1.5L10 2 8 3.5 6 2z"/><line x1="8.5" y1="7.5" x2="15.5" y2="7.5"/><line x1="8.5" y1="11.5" x2="15.5" y2="11.5"/><line x1="8.5" y1="15.5" x2="13" y2="15.5"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></svg>',
};
const icon = (name, cls) => '<span class="icon ' + (cls||'') + '">' + ICONS[name] + '</span>';

function computeTotals(){
  let income=0, expense=0;
  DB.transactions.forEach(t => {
    const amt = Number(t.amount) || 0;
    if (t.type==='income') income += amt;
    else expense += amt;
  });
  return {income, expense, balance: income - expense};
}

function currentMonthTx(){
  const now = new Date();
  const localMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  return DB.transactions.filter(t => {
    if (!t.date || typeof t.date !== 'string') return false;
    return t.date.substring(0, 7) === localMonthKey;
  });
}

function computeMonthStats(){
  const primary = getPrimaryIncomeCat();
  let primaryIncome=0, secondaryIncome=0, expense=0;
  const txs = currentMonthTx();

  txs.forEach(t => {
    const amt = Number(t.amount) || 0;
    if (t.type==='income'){
      if (primary && t.categoryId === primary.id) primaryIncome += amt;
      else secondaryIncome += amt;
    } else {
      expense += amt;
    }
  });

  const income = primaryIncome + secondaryIncome;
  const netSavings = income - expense;
  const savingsRate = income > 0 ? Math.max(0, Math.round((netSavings / income) * 100)) : 0;

  return {primaryIncome, secondaryIncome, expense, income, netSavings, savingsRate};
}

function computeMonthOverMonthMetrics(){
  const now = new Date();
  const curY = now.getFullYear();
  const curM = now.getMonth();

  const prevMDate = new Date(curY, curM - 1, 1);
  const prevMonthKey = `${prevMDate.getFullYear()}-${String(prevMDate.getMonth() + 1).padStart(2, '0')}`;
  const currentMonthKey = `${curY}-${String(curM + 1).padStart(2, '0')}`;

  let currentExpense = 0, prevExpense = 0;
  let currentIncome = 0, prevIncome = 0;
  const currentCatMap = {};
  const prevCatMap = {};

  DB.transactions.forEach(t => {
    if (!t.date) return;
    const mKey = t.date.substring(0, 7);
    const amt = Number(t.amount) || 0;

    if (mKey === currentMonthKey){
      if (t.type === 'expense') {
        currentExpense += amt;
        currentCatMap[t.categoryId] = (currentCatMap[t.categoryId] || 0) + amt;
      } else {
        currentIncome += amt;
      }
    } else if (mKey === prevMonthKey){
      if (t.type === 'expense') {
        prevExpense += amt;
        prevCatMap[t.categoryId] = (prevCatMap[t.categoryId] || 0) + amt;
      } else {
        prevIncome += amt;
      }
    }
  });

  const currentSavings = currentIncome - currentExpense;
  const prevSavings = prevIncome - prevExpense;

  let expChangePct = 0;
  if (prevExpense > 0) expChangePct = Math.round(((currentExpense - prevExpense) / prevExpense) * 100);
  else if (currentExpense > 0) expChangePct = 100;

  let incChangePct = 0;
  if (prevIncome > 0) incChangePct = Math.round(((currentIncome - prevIncome) / prevIncome) * 100);
  else if (currentIncome > 0) incChangePct = 100;

  let highestGrowthCat = null;
  let maxDiff = -Infinity;
  Object.keys(currentCatMap).forEach(catId => {
    const curVal = currentCatMap[catId];
    const prevVal = prevCatMap[catId] || 0;
    const diff = curVal - prevVal;
    if (diff > maxDiff && diff > 0){
      maxDiff = diff;
      highestGrowthCat = catById(catId);
    }
  });

  const savingsRate = currentIncome > 0 ? Math.max(0, Math.round((currentSavings / currentIncome) * 100)) : 0;

  return {
    expChangePct, currentExpense, prevExpense,
    incChangePct, currentIncome, prevIncome,
    currentSavings, prevSavings, savingsRate,
    highestGrowthCat, maxDiff
  };
}

function computeCategoryTotals(){
  const map = {};
  currentMonthTx().forEach(t => {
    if (t.type === 'expense') {
      const amt = Number(t.amount) || 0;
      map[t.categoryId] = (map[t.categoryId] || 0) + amt;
    }
  });
  return Object.entries(map)
    .map(([id, total]) => ({id, total, cat: catById(id)}))
    .filter(r => r.cat)
    .sort((a,b) => b.total - a.total);
}

function computeBurnMetrics(){
  const today = new Date();
  const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  const currentDay = today.getDate();
  const daysRemaining = Math.max(1, daysInMonth - currentDay + 1);
  const monthPctPassed = Math.round((currentDay / daysInMonth) * 100);

  const totals = computeTotals();
  const monthStats = computeMonthStats();

  // Dinero disponible para repartir entre los días que quedan del mes.
  const availableFunds = totals.balance > 0
    ? totals.balance
    : Math.max(0, monthStats.income - monthStats.expense);

  const remainingMonthMoney = Math.max(0, availableFunds);
  const dailyAvailable = remainingMonthMoney / daysRemaining;

  // Categorías que no forman parte del gasto cotidiano.
  const fixedCatIds = DB.categories
    .filter(c =>
      c.isFixed ||
      c.icon === 'home' ||
      c.icon === 'zap' ||
      (c.name||'').toLowerCase().includes('arriendo') ||
      (c.name||'').toLowerCase().includes('servicio')
    )
    .map(c => c.id);

  // ===== Ritmo de gasto: opción A =====
  // Tres bloques móviles de 10 días: actual, anterior y anterior 2.
  const DAYS_PER_PERIOD = 10;
  const NUM_PERIODS = 3;
  const LOOKBACK_DAYS = DAYS_PER_PERIOD * NUM_PERIODS;

  const tenDayExpenses = [0, 0, 0];

  DB.transactions.forEach(t => {
    if (t.type !== 'expense' || fixedCatIds.includes(t.categoryId) || !t.date) return;

    const tDate = new Date(t.date + 'T00:00:00');
    if (Number.isNaN(tDate.getTime())) return;

    const diffMs = todayStart.getTime() - tDate.getTime();
    const diffDays = Math.floor(diffMs / (24 * 60 * 60 * 1000));

    if (diffDays < 0 || diffDays >= LOOKBACK_DAYS) return;

    const periodIndex = Math.floor(diffDays / DAYS_PER_PERIOD);
    tenDayExpenses[periodIndex] += Number(t.amount) || 0;
  });

  // Promedio vivo: durante los primeros días no esperamos a completar 10 días.
  const currentPeriodDays = Math.min(
    DAYS_PER_PERIOD,
    ((currentDay - 1) % DAYS_PER_PERIOD) + 1
  );

  const currentPeriodStart = new Date(todayStart);
  currentPeriodStart.setDate(currentPeriodStart.getDate() - (currentPeriodDays - 1));

  let currentPeriodExpense = 0;
  DB.transactions.forEach(t => {
    if (t.type !== 'expense' || fixedCatIds.includes(t.categoryId) || !t.date) return;

    const tDate = new Date(t.date + 'T00:00:00');
    if (Number.isNaN(tDate.getTime())) return;

    if (tDate >= currentPeriodStart && tDate <= todayStart) {
      currentPeriodExpense += Number(t.amount) || 0;
    }
  });

  const currentAvgDailyBurn = currentPeriodExpense > 0
    ? currentPeriodExpense / currentPeriodDays
    : 0;

  const avgDailyBurn = currentAvgDailyBurn > 0
    ? currentAvgDailyBurn
    : (() => {
        const previous = tenDayExpenses
          .slice(1)
          .filter(v => v > 0)
          .map(v => v / DAYS_PER_PERIOD);
        return previous.length
          ? previous.reduce((s, v) => s + v, 0) / previous.length
          : 0;
      })();

  const avgTenDayBurn = avgDailyBurn * DAYS_PER_PERIOD;

  // Autonomía usando el ritmo diario actual.
  const runwayDays = (avgDailyBurn > 0 && totals.balance > 0)
    ? Math.floor(totals.balance / avgDailyBurn)
    : 0;

  return {
    daysRemaining,
    daysInMonth,
    currentDay,
    monthPctPassed,
    dailyAvailable,
    avgDailyBurn,
    avgTenDayBurn,
    currentPeriodExpense,
    currentPeriodDays,
    tenDayExpenses,
    runwayDays
  };
}

function computeBudgetRows(){
  const totals = computeCategoryTotals();
  const burn = computeBurnMetrics();

  return DB.categories.filter(c => c.type==='expense' && c.budget).map(c => {
    const spent = (totals.find(r => r.id===c.id) || {}).total || 0;
    const spentPct = Math.min(100, Math.round((spent / c.budget) * 100));
    const over = spent > c.budget;
    const isPacingFast = !over && (spentPct > burn.monthPctPassed + 10);
    return {cat:c, spent, pct: spentPct, over, isPacingFast};
  });
}

function computeCreditsPaidThisMonth(){
  const now = new Date();
  const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  return (DB.credits || [])
    .filter(c => c.type === 'against')
    .reduce((sum, c) => {
      const monthlyPaid = (c.payments || [])
        .filter(p => p.date && typeof p.date === 'string' && p.date.substring(0,7) === currentMonthKey)
        .reduce((s,p) => s + (Number(p.amount)||0), 0);
      return sum + monthlyPaid;
    }, 0);
}

function filteredTx(){
  return DB.transactions
    .filter(t => UI.txFilter==='all' ? true : t.type===UI.txFilter)
    .filter(t => {
      if (!UI.search.trim()) return true;
      const s = UI.search.toLowerCase();
      const cat = catById(t.categoryId);
      return (t.note||'').toLowerCase().includes(s) || (cat && cat.name.toLowerCase().includes(s));
    })
    .sort((a,b) => (b.date+b.id).localeCompare(a.date+a.id));
}

function expensePieSVG(catTotals, monthExpense, monthIncome, creditsPending){
  creditsPending = Number(creditsPending) || 0;
  if (!catTotals.length && creditsPending <= 0) return '';

  const cx = 60, cy = 60, r = 44, stroke = 16;
  const circumference = 2 * Math.PI * r;
  // Pequeño gap visual entre segmentos para que no se vean pegados
  const gap = 3.2;
  const usable = Math.max(0, circumference - gap);
  const CREDIT_COLOR = '#9F1239';

  // Si hay ingreso, la torta representa el 100% del ingreso.
  // Si no hay ingreso, caemos al comportamiento anterior (100% = gastos + créditos).
  const base = (monthIncome > 0) ? monthIncome : (monthExpense + creditsPending);
  const remainingPct = (monthIncome > 0) ? Math.max(0, (monthIncome - monthExpense - creditsPending) / monthIncome) : 0;

  let offset = 0;
  const slices = [];

  // Segmentos de categorías (proporcionales al ingreso o al total de gastos)
  catTotals.forEach(rw => {
    const pct = Math.max(0, rw.total / base);
    if (pct <= 0) return;
    const rawDash = pct * usable;
    const dash = Math.max(0, rawDash - gap * 0.15); // deja un poquito de aire
    slices.push({ color: rw.cat.color, dash, offset, isRemaining: false });
    offset += rawDash + (gap * 0.35);
  });

  // Segmento de créditos pendientes (deudas), solo si hay algo pendiente
  if (creditsPending > 0 && base > 0) {
    const pct = Math.max(0, creditsPending / base);
    const rawDash = pct * usable;
    const dash = Math.max(0, rawDash - gap * 0.15);
    slices.push({ color: CREDIT_COLOR, dash, offset, isRemaining: false });
    offset += rawDash + (gap * 0.35);
  }

  // Segmento gris = porcentaje de ingreso aún disponible
  if (remainingPct > 0.005) {
    const rawDash = remainingPct * usable;
    const dash = Math.max(0, rawDash - gap * 0.1);
    slices.push({ color: '#D6D1E8', dash, offset, isRemaining: true });
  }

  let svg = '<svg viewBox="0 0 120 120" aria-label="Gastos y créditos respecto al ingreso">';
  // Fondo sutil
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#F0ECF8" stroke-width="'+stroke+'"/>';

  slices.forEach(s => {
    if (s.dash > 0.5) {
      svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="'+stroke+'" ' +
        'stroke-dasharray="'+s.dash.toFixed(2)+' '+(circumference - s.dash).toFixed(2)+'" ' +
        'stroke-dashoffset="'+(-s.offset).toFixed(2)+'" transform="rotate(-90 60 60)" stroke-linecap="butt" />';
    }
  });

  svg += '</svg>';
  return svg;
}

function startMomCarousel(){
  if (momInterval) clearInterval(momInterval);
  momSlideIndex = 0;
  const track = document.getElementById('mom-track');
  const dots = document.querySelectorAll('.mom-dot');
  if (!track) return;

  const total = track.children.length || 5;
  momInterval = setInterval(() => {
    momSlideIndex = (momSlideIndex + 1) % total;
    track.style.transform = `translateX(-${momSlideIndex * 100}%)`;
    dots.forEach((d,i) => d.classList.toggle('active', i === momSlideIndex));
  }, 4200);
}

const GEMINI_MODEL = 'gemini-2.5-flash';
const GEMINI_MODELS_ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models';
const GEMINI_INVOICE_PROMPT = 'Analiza esta foto de una factura o recibo de compra. Devuelve ÚNICAMENTE un JSON con este formato exacto, sin texto adicional ni markdown: {"items":[{"name":"nombre del producto","price":12500}]}. Reglas: incluye solo los productos/artículos comprados; NO incluyas NIT, IVA, subtotal, total, cambio, efectivo, fecha, ni datos del establecimiento. Los precios deben ser números enteros en pesos, sin puntos, comas ni símbolos. Si el nombre de un producto está cortado o poco claro, usa tu mejor interpretación razonable. Si una línea no tiene un precio claro, no la incluyas.';

async function callGeminiForInvoice(base64Data, mimeType){
  const apiKey = (DB.settings && DB.settings.geminiApiKey) ? DB.settings.geminiApiKey.trim() : '';
  if (!apiKey){
    throw new Error('Primero agrega tu clave de Gemini en Ajustes (sección "Reconocimiento de facturas").');
  }

  // Google permite consultar los modelos disponibles para una API key.
  // Usamos esa lista solo para obtener candidatos y después probamos la llamada real.
  let available = [];
  try {
    const modelsResp = await fetch(GEMINI_MODELS_ENDPOINT + '?key=' + encodeURIComponent(apiKey), {
      method: 'GET',
      headers: { 'Accept': 'application/json' }
    });
    const modelsData = await modelsResp.json().catch(() => null);
    if (!modelsResp.ok){
      const msg = modelsData && modelsData.error && modelsData.error.message ? modelsData.error.message : '';
      if (modelsResp.status === 400 || modelsResp.status === 401 || modelsResp.status === 403){
        throw new Error('Tu clave de Gemini no es válida o no tiene acceso a la Gemini API. Revísala en Google AI Studio.');
      }
      throw new Error('No se pudo consultar los modelos de Gemini (error ' + modelsResp.status + ').' + (msg ? ' ' + msg : ''));
    }
    available = Array.isArray(modelsData && modelsData.models) ? modelsData.models : [];
  } catch(err){
    if (err && err.message && !/Failed to fetch|NetworkError|Load failed/i.test(err.message)) throw err;
    throw new Error('No se pudo conectar con Gemini. Revisa tu conexión a internet.');
  }

  const supported = available.filter(m => {
    const name = String(m && (m.name || m.baseModelId || '')).replace(/^models\//, '');
    const methods = Array.isArray(m && m.supportedGenerationMethods) ? m.supportedGenerationMethods : [];
    return !!name && methods.includes('generateContent') && !/(embedding|image-generation|imagen|veo|tts|live|audio|robotics|transcribe)/i.test(name);
  });

  const preferred = [
    'gemini-2.5-flash',
    'gemini-2.5-flash-lite',
    'gemini-2.0-flash',
    'gemini-2.0-flash-lite',
    'gemini-2.5-pro',
    'gemini-3-flash-preview',
    'gemini-3.5-flash',
    'gemini-flash-latest'
  ];

  const candidates = [];
  const addCandidate = (name) => {
    name = String(name || '').replace(/^models\//, '').trim();
    if (name && !candidates.includes(name)) candidates.push(name);
  };

  // Primero, modelos que la propia API reporta para esta clave.
  preferred.forEach(wanted => {
    const found = supported.find(m => {
      const n = String(m.name || m.baseModelId || '').replace(/^models\//, '');
      return n === wanted;
    });
    if (found) addCandidate(found.name || found.baseModelId);
  });
  supported.forEach(m => addCandidate(m.name || m.baseModelId));

  // Si la lista del proyecto es inconsistente o está desactualizada, estos son
  // nombres oficiales conocidos que se prueban como respaldo.
  preferred.forEach(addCandidate);

  const body = {
    contents: [{
      role: 'user',
      parts: [
        { text: GEMINI_INVOICE_PROMPT },
        { inline_data: { mime_type: mimeType, data: base64Data } }
      ]
    }],
    generationConfig: {
      responseMimeType: 'application/json'
    }
  };

  let lastStatus = 0;
  let lastMessage = '';
  let lastModel = '';

  for (const modelName of candidates){
    // Probamos v1beta (documentado para generateContent) y v1 como respaldo.
    for (const apiVersion of ['v1beta', 'v1']){
      const endpoint = 'https://generativelanguage.googleapis.com/' + apiVersion + '/models/' + encodeURIComponent(modelName) + ':generateContent?key=' + encodeURIComponent(apiKey);
      let resp;
      try {
        resp = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      } catch(networkErr){
        throw new Error('No se pudo conectar con Gemini. Revisa tu conexión a internet.');
      }

      let data = null;
      try { data = await resp.json(); } catch(e) {}
      if (resp.ok){
        const text = data && data.candidates && data.candidates[0] && data.candidates[0].content && Array.isArray(data.candidates[0].content.parts)
          ? data.candidates[0].content.parts.filter(part => part && typeof part.text === 'string').map(part => part.text).join('')
          : '';
        if (!text) throw new Error('Gemini no devolvió resultados. Intenta con una foto más clara.');

        let parsed;
        try { parsed = JSON.parse(text); } catch(e){
          const cleaned = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
          try { parsed = JSON.parse(cleaned); } catch(e2){ throw new Error('No se pudo interpretar la respuesta de Gemini. Intenta de nuevo.'); }
        }

        const rawItems = Array.isArray(parsed.items) ? parsed.items : [];
        return rawItems
          .map(it => ({ id: uid(), name: String(it.name || '').trim().slice(0,60) || 'Ítem', price: Math.round(Number(it.price)) || 0 }))
          .filter(it => it.price > 0);
      }

      const msg = data && data.error && data.error.message ? data.error.message : '';
      lastStatus = resp.status;
      lastMessage = msg;
      lastModel = modelName;

      // 404/400 pueden significar que ese alias/modelo no es usable con esa versión.
      // Probamos el siguiente candidato sin cambiar nada de la interfaz.
      if (resp.status === 404 || resp.status === 400) continue;
      if (resp.status === 401 || resp.status === 403){
        throw new Error('Tu clave de Gemini no es válida o no tiene permisos para usar la Gemini API. Revísala en Google AI Studio.');
      }
      if (resp.status === 429){
        throw new Error('Alcanzaste el límite gratuito de Gemini por ahora. Intenta de nuevo en unos minutos.');
      }
    }
  }

  if (lastStatus === 404){
    throw new Error('Google respondió 404 para los modelos disponibles. Último modelo probado: ' + lastModel + (lastMessage ? '. ' + lastMessage : '. La API key puede estar limitada a otro proyecto o configuración de Gemini.') );
  }
  if (lastStatus === 400){
    throw new Error('Gemini rechazó la solicitud. ' + (lastMessage || 'La API key o el modelo no aceptan esta solicitud.'));
  }
  throw new Error('No se pudo completar la solicitud a Gemini.' + (lastMessage ? ' ' + lastMessage : ''));
}

async function handleInvoiceImage(file){
  scanningOverlay = {message:'Preparando imagen...'};
  renderOverlays();
  try {
    const reader = new FileReader();
    const dataUrl = await new Promise((res, rej) => {
      reader.onload = () => res(reader.result);
      reader.onerror = () => rej(new Error('No se pudo leer la imagen'));
      reader.readAsDataURL(file);
    });

    const match = String(dataUrl).match(/^data:([^;]+);base64,(.*)$/);
    if (!match) throw new Error('Formato de imagen no soportado.');
    const mimeType = match[1];
    const base64Data = match[2];

    scanningOverlay = {message:'Analizando factura con Gemini...'};
    renderOverlays();

    const items = await callGeminiForInvoice(base64Data, mimeType);
    scanningOverlay = null;

    sheet = {
      kind:'invoice', mode:'new', id:null,
      title:'Factura ' + todayStr(),
      date: todayStr(),
      items: items.length ? items : [{id:uid(), name:'', price:''}],
      registered:false, categoryId:null, txId:null
    };
    renderOverlays();
  } catch(err){
    scanningOverlay = null;
    renderOverlays();
    alert((err && err.message) ? err.message : 'No se pudo procesar la imagen. Intenta con más luz o una foto más nítida.');
  }
}

function computeCreditsSummary(){
  const now = new Date();
  const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const prevMonthKey = `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;

  let againstTotal = 0, againstPaidTotal = 0, againstPaidThisMonth = 0, againstPaidPrevMonth = 0, againstCount = 0;
  let favorTotal = 0, favorPaidTotal = 0, favorPaidThisMonth = 0, favorPaidPrevMonth = 0, favorCount = 0;

  (DB.credits || []).forEach(c => {
    const total = Number(c.total) || 0;
    const payments = c.payments || [];
    const paidTotal = payments.reduce((s,p) => s + (Number(p.amount)||0), 0);
    const paidThisMonth = payments
      .filter(p => p.date && typeof p.date === 'string' && p.date.substring(0,7) === currentMonthKey)
      .reduce((s,p) => s + (Number(p.amount)||0), 0);
    const paidPrevMonth = payments
      .filter(p => p.date && typeof p.date === 'string' && p.date.substring(0,7) === prevMonthKey)
      .reduce((s,p) => s + (Number(p.amount)||0), 0);

    if (c.type === 'against'){
      againstTotal += total;
      againstPaidTotal += paidTotal;
      againstPaidThisMonth += paidThisMonth;
      againstPaidPrevMonth += paidPrevMonth;
      againstCount += 1;
    } else if (c.type === 'favor'){
      favorTotal += total;
      favorPaidTotal += paidTotal;
      favorPaidThisMonth += paidThisMonth;
      favorPaidPrevMonth += paidPrevMonth;
      favorCount += 1;
    }
  });

  const againstPending = Math.max(0, againstTotal - againstPaidTotal);
  const favorPending = Math.max(0, favorTotal - favorPaidTotal);
  const againstProgressPct = againstTotal > 0 ? Math.min(100, Math.round((againstPaidTotal / againstTotal) * 100)) : 0;
  const favorProgressPct = favorTotal > 0 ? Math.min(100, Math.round((favorPaidTotal / favorTotal) * 100)) : 0;

  let paymentChangePct = 0;
  if (againstPaidPrevMonth > 0) paymentChangePct = Math.round(((againstPaidThisMonth - againstPaidPrevMonth) / againstPaidPrevMonth) * 100);
  else if (againstPaidThisMonth > 0) paymentChangePct = 100;

  return {
    againstTotal, againstPaidTotal, againstPending, againstProgressPct, againstCount,
    againstPaidThisMonth, againstPaidPrevMonth, paymentChangePct,
    favorTotal, favorPaidTotal, favorPending, favorProgressPct, favorCount,
    favorPaidThisMonth, favorPaidPrevMonth
  };
}

function renderCredits(){
  let html = '';
  const summary = computeCreditsSummary();

  if (summary.againstCount > 0 || summary.favorCount > 0){
    html += '<div class="balance-card">';

    if (summary.againstCount > 0){
      html += '<div class="balance-label">Total que debo</div>';
      html += '<div class="balance-amount" style="color:var(--expense)">' + fmtMoney(summary.againstPending) + '</div>';
      html += '<div class="balance-month">de ' + fmtMoney(summary.againstTotal) + ' en ' + summary.againstCount + ' crédito' + (summary.againstCount===1?'':'s') + '</div>';
      html += '<div class="bar-track" style="margin-top:10px;"><div class="bar-fill" style="width:' + summary.againstProgressPct + '%;background:var(--income)"></div></div>';
      html += '<div style="font-size:11px;color:var(--ink-muted);margin-top:4px;">Has pagado el ' + summary.againstProgressPct + '% del total de tus deudas</div>';
    }

    if (summary.favorCount > 0){
      html += '<div style="margin-top:' + (summary.againstCount>0?'16px':'0') + ';padding-top:' + (summary.againstCount>0?'14px':'0') + ';border-top:' + (summary.againstCount>0?'1px solid var(--line)':'none') + ';">';
      html += '<div class="balance-label">Total que me deben</div>';
      html += '<div class="balance-amount" style="font-size:26px;color:var(--income)">' + fmtMoney(summary.favorPending) + '</div>';
      html += '<div class="balance-month">de ' + fmtMoney(summary.favorTotal) + ' en ' + summary.favorCount + ' cobro' + (summary.favorCount===1?'':'s') + '</div>';
      html += '</div>';
    }

    if (summary.againstCount > 0){
      const changeUp = summary.paymentChangePct > 0;
      const changeDown = summary.paymentChangePct < 0;
      const arrow = changeUp ? '▲' : (changeDown ? '▼' : '—');
      const deltaColor = changeUp ? 'var(--income)' : (changeDown ? 'var(--amber)' : 'var(--ink-muted)');
      html += '<div class="balance-metrics">';
      html += '<div class="b-metric"><span class="lbl">Abonado este mes</span><span class="val inc">' + fmtMoney(summary.againstPaidThisMonth) + '</span></div>';
      html += '<div class="b-metric"><span class="lbl">Abonado mes pasado</span><span class="val">' + fmtMoney(summary.againstPaidPrevMonth) + '</span></div>';
      html += '<div class="b-metric"><span class="lbl">Variación en abonos</span><span class="val" style="color:' + deltaColor + '">' + arrow + ' ' + Math.abs(summary.paymentChangePct) + '%</span></div>';
      html += '<div class="b-metric"><span class="lbl">Créditos activos (deudas)</span><span class="val sav">' + summary.againstCount + '</span></div>';
      html += '</div>';
    }

    html += '</div>';
  }

  html += '<div class="filter-row" style="margin-bottom:14px;">';
  [['against','En contra (Deudas)'],['favor','A favor (Cobros)']].forEach(([val,label]) => {
    html += '<button class="chip ' + (UI.creditFilter===val?'selected':'') + '" data-action="set-credit-filter" data-filter="' + val + '">' + label + '</button>';
  });
  html += '</div>';

  const list = (DB.credits || []).filter(c => c.type === UI.creditFilter);
  if (!list.length){
    return html + '<div class="empty-state">No hay créditos registrados en esta sección.</div>';
  }

  list.forEach(c => {
    const totalPaid = (c.payments || []).reduce((sum, p) => sum + (Number(p.amount)||0), 0);
    const pending = Math.max(0, Number(c.total) - totalPaid);
    const pct = c.total > 0 ? Math.min(100, Math.round((totalPaid / c.total) * 100)) : 0;
    const isAgainst = c.type === 'against';
    const colorBar = isAgainst ? 'var(--expense)' : 'var(--income)';

    html += '<div class="credit-card">';
    html += '<div class="credit-head"><div><div class="credit-title">' + esc(c.title) + '</div><div class="credit-sub">Total: ' + fmtMoney(c.total) + '</div></div>';
    html += '<button data-action="edit-credit" data-id="' + c.id + '">' + icon('pencil') + '</button></div>';

    html += '<div class="credit-values"><span>Falta por ' + (isAgainst ? 'pagar' : 'cobrar') + ':</span>';
    html += '<span class="credit-pending ' + (isAgainst ? 'against' : 'favor') + '">' + fmtMoney(pending) + '</span></div>';

    html += '<div class="bar-track" style="margin-bottom:12px;"><div class="bar-fill" style="width:' + pct + '%;background:' + colorBar + '"></div></div>';

    if (c.payments && c.payments.length){
      html += '<div style="margin-top:8px;"><span style="font-size:11px;font-weight:700;color:var(--ink-muted);">HISTORIAL DE APORTES:</span>';
      c.payments.forEach(p => {
        html += '<div class="payment-item"><span>' + esc(p.date) + (p.note ? ' - ' + esc(p.note) : '') + '</span>' +
          '<span><b>+' + fmtMoney(p.amount) + '</b> <button style="margin-left:6px" data-action="edit-payment" data-cid="' + c.id + '" data-pid="' + p.id + '">' + icon('pencil') + '</button></span></div>';
      });
      html += '</div>';
    }

    html += '<button class="add-pay-btn" data-action="new-payment" data-id="' + c.id + '">+ Agregar aporte</button>';
    html += '</div>';
  });

  return html;
}

  html += '<button class="secondary-btn" data-action="export-backup">Exportar copia de seguridad</button>';
  html += '<button class="secondary-btn" data-action="import-backup">Importar copia de seguridad</button>';

  html += '<button class="danger-btn" data-action="reset-data" style="margin-top:18px">Borrar todos los datos</button>';
  return html;
}

      ? `background: linear-gradient(135deg, ${c.color}, ${c.color}DD); color: #fff; border-color: transparent; box-shadow: 0 6px 16px ${c.color}55; transform: scale(1.02);`
      : `background: var(--card); border: 1.5px solid var(--line); color: var(--ink);`;
    const iconBg = sel ? 'background: rgba(255,255,255,0.25);' : `background: ${c.color}15;`;

  }).join('');
}

function attachSheetFieldSync(){
  if (sheet.kind === 'tx'){
    const a = document.getElementById('f-amount'), d = document.getElementById('f-date'), n = document.getElementById('f-note');
    if (a) a.addEventListener('input', (e) => {
      const raw = parseFormattedNumber(e.target.value);
      sheet.amount = raw;
      e.target.value = formatThousandInput(raw);
      refreshSaveState();
    });
    if (d) d.addEventListener('input', () => { sheet.date = d.value; });
    if (n) n.addEventListener('input', () => { sheet.note = n.value; });
  } else if (sheet.kind === 'quick'){
    const a = document.getElementById('q-amount'), n = document.getElementById('q-note'), d = document.getElementById('q-date');
    if (a) a.addEventListener('input', (e) => {
      const raw = parseFormattedNumber(e.target.value);
      sheet.amount = raw;
      e.target.value = formatThousandInput(raw);
      refreshSaveState();
    });
    if (n) n.addEventListener('input', () => { sheet.note = n.value; });
    if (d) d.addEventListener('input', () => { sheet.date = d.value; });
  } else if (sheet.kind === 'cat'){
    const nm = document.getElementById('f-name'), b = document.getElementById('f-budget');
    if (nm) nm.addEventListener('input', () => { sheet.name = nm.value; refreshSaveState(); });
    if (b) b.addEventListener('input', (e) => {
      const raw = parseFormattedNumber(e.target.value);
      sheet.budget = raw;
      e.target.value = formatThousandInput(raw);
    });
  } else if (sheet.kind === 'credit'){
    const t = document.getElementById('c-title'), tot = document.getElementById('c-total');
    if (t) t.addEventListener('input', () => { sheet.title = t.value; refreshSaveState(); });
    if (tot) tot.addEventListener('input', (e) => {
      const raw = parseFormattedNumber(e.target.value);
      sheet.total = raw;
      e.target.value = formatThousandInput(raw);
      refreshSaveState();
    });
  } else if (sheet.kind === 'payment'){
    const a = document.getElementById('p-amount'), d = document.getElementById('p-date'), n = document.getElementById('p-note');
    if (a) a.addEventListener('input', (e) => {
      const raw = parseFormattedNumber(e.target.value);
      sheet.amount = raw;
      e.target.value = formatThousandInput(raw);
      refreshSaveState();
    });
    if (d) d.addEventListener('input', () => { sheet.date = d.value; });
    if (n) n.addEventListener('input', () => { sheet.note = n.value; });
  } else if (sheet.kind === 'invoice'){
    const ti = document.getElementById('inv-title'), da = document.getElementById('inv-date');
    if (ti) ti.addEventListener('input', () => { sheet.title = ti.value; });
    if (da) da.addEventListener('input', () => { sheet.date = da.value; });

    const list = document.getElementById('inv-items-list');
    if (list) list.addEventListener('input', (e) => {
      const idx = e.target.dataset.idx, field = e.target.dataset.field;
      if (idx === undefined || !field) return;
      if (field === 'price'){
        const raw = parseFormattedNumber(e.target.value);
        sheet.items[idx].price = raw;
        e.target.value = formatThousandInput(raw);
      } else {
        sheet.items[idx][field] = e.target.value;
      }
      const totalEl = document.getElementById('inv-total-val');
      if (totalEl) totalEl.textContent = fmtMoney(sheet.items.reduce((s,it)=>s+(Number(it.price)||0),0));
      refreshInvoiceSaveState();
    });
  }
}

function refreshSaveState(){
  if (sheet.kind === 'tx'){
    const btn = document.getElementById('tx-save-btn');
    if (btn) btn.disabled = !(Number(sheet.amount) > 0 && sheet.categoryId);
  } else if (sheet.kind === 'quick'){
    const btn = document.getElementById('quick-save-btn');
    if (btn) btn.disabled = !(Number(sheet.amount) > 0);
  } else if (sheet.kind === 'cat'){
    const btn = document.getElementById('cat-save-btn');
    if (btn) btn.disabled = !(sheet.name.trim().length > 0);
  } else if (sheet.kind === 'credit'){
    const btn = document.getElementById('credit-save-btn');
    if (btn) btn.disabled = !(sheet.title.trim().length > 0 && Number(sheet.total) > 0);
  } else if (sheet.kind === 'payment'){
    const btn = document.getElementById('pay-save-btn');
    if (btn) btn.disabled = !(Number(sheet.amount) > 0);
  }
}

function saveTxSheet(){
  const amount = Number(sheet.amount);
  if (!(amount > 0) || !sheet.categoryId) return;
  const tx = {id:sheet.id||uid(), type:sheet.type, amount: amount, categoryId:sheet.categoryId, date:sheet.date||todayStr(), note:(sheet.note||'').trim()};
  const exists = DB.transactions.some(t => t.id === tx.id);
  DB.transactions = exists ? DB.transactions.map(t => t.id===tx.id?tx:t) : DB.transactions.concat([tx]);

  if (sheet.sourceInvoiceId){
    DB.invoices = (DB.invoices||[]).map(inv => inv.id === sheet.sourceInvoiceId
      ? Object.assign({}, inv, {registered:true, categoryId:tx.categoryId, txId:tx.id})
      : inv);
  }

  saveDB(); sheet=null; render();
}

function saveCatSheet(){

    budget:sheet.type==='expense'&&sheet.budget?Number(sheet.budget):null,

function saveCreditSheet(){
  const total = Number(sheet.total);
  if (!sheet.title.trim() || !(total > 0)) return;
  if (!DB.credits) DB.credits = [];
  const credit = {
    id: sheet.id || uid(),
    title: sheet.title.trim(),
    type: sheet.type,
    total: total,
    payments: sheet.id ? ((DB.credits.find(x => x.id === sheet.id)||{}).payments||[]) : []
  };
  const exists = DB.credits.some(c => c.id === credit.id);
  DB.credits = exists ? DB.credits.map(c => c.id === credit.id ? credit : c) : DB.credits.concat([credit]);
  saveDB(); sheet = null; render();
}
function deleteCredit(id){
  DB.credits = (DB.credits||[]).filter(c => c.id !== id);
  saveDB(); sheet = null; confirmState = null; render();
}

function openNewPayment(creditId){

  renderOverlays();

function openEditPayment(creditId, paymentId){
  const c = (DB.credits||[]).find(x => x.id === creditId);
  if (!c) return;
  const p = (c.payments||[]).find(x => x.id === paymentId);
  if (!p) return;
  sheet = {kind:'payment', mode:'edit', creditId:creditId, paymentId:p.id, amount:String(Number(p.amount)||0), date:p.date, note:p.note||''};
  renderOverlays();
}
function savePaymentSheet(){
  const amount = Number(sheet.amount);
  if (!(amount > 0)) return;
  const p = {id: sheet.paymentId || uid(), amount: amount, date: sheet.date || todayStr(), note: (sheet.note||'').trim()};
  DB.credits = DB.credits.map(c => {
    if (c.id === sheet.creditId){
      let pays = c.payments || [];
      const exists = pays.some(x => x.id === p.id);
      pays = exists ? pays.map(x => x.id === p.id ? p : x) : pays.concat([p]);
      return Object.assign({}, c, {payments: pays});
    }
    return c;
  });
  saveDB(); sheet = null; render();
}
function deletePayment(creditId, paymentId){
  DB.credits = DB.credits.map(c => {
    if (c.id === creditId){
      return Object.assign({}, c, {payments: (c.payments||[]).filter(p => p.id !== paymentId)});
    }
    return c;
  });
  saveDB(); sheet = null; confirmState = null; render();
}

function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='finanzas-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importBackupFile(file){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed||!Array.isArray(parsed.transactions)||!Array.isArray(parsed.categories)) throw new Error('formato inválido');
      DB={
        transactions: (parsed.transactions||[]).map(t => ({...t, amount: Number(t.amount)||0})),
        categories: parsed.categories,
        credits: (parsed.credits||[]).map(c => ({
          ...c,
          total: Number(c.total)||0,
          payments: (c.payments||[]).map(p => ({...p, amount: Number(p.amount)||0}))
        })),
        invoices: (parsed.invoices||[]).map(inv => ({
          ...inv,
          total: Number(inv.total)||0,
          items: (inv.items||[]).map(it => ({...it, price: Number(it.price)||0}))
        })),
        settings: parsed.settings||{currency:'COP'}
      };
      saveDB(); render();
    }catch(err){alert('Copia de seguridad no válida.');}
  };
  reader.readAsText(file);
}

document.addEventListener('click',(e)=>{
  const t=e.target.closest('[data-action]');
  if(!t)return;
  const action=t.dataset.action;

  if(action==='set-tab'){UI.tab=t.dataset.tab;render();return;}
  if(action==='set-filter'){UI.txFilter=t.dataset.filter;refreshTxList();return;}
  if(action==='set-credit-filter'){UI.creditFilter=t.dataset.filter;render();return;}

  if(action==='new-tx'){openNewTx();return;}
  if(action==='edit-tx'){openEditTx(t.dataset.id);return;}
  if(action==='quick-cat'){openQuickAdd(t.dataset.id);return;}
  if(action==='show-note'){sheet.showNote=true;renderOverlays();return;}
  if(action==='show-date'){sheet.showDate=true;renderOverlays();return;}
  if(action==='save-quick'){saveQuickSheet();return;}

  if(action==='tx-type'){
    sheet.type=t.dataset.type;
    const firstOfType=DB.categories.find(c=>c.type===sheet.type);
    sheet.categoryId=firstOfType?firstOfType.id:'';
    renderOverlays();
    return;
  }
  if(action==='pick-tx-cat'){
    sheet.categoryId=t.dataset.id;
    const chipContainer = document.getElementById('chipList');
    if(chipContainer){
      const cats = DB.categories.filter(c => c.type === sheet.type);
      chipContainer.innerHTML = renderTxCatChips(cats, sheet.categoryId);
    }
    refreshSaveState();
    return;
  }
  if(action==='save-tx'){saveTxSheet();return;}
  if(action==='delete-tx'){confirmState={message:'Eliminar este movimiento.',onConfirm:()=>deleteTx(sheet.id)};renderOverlays();return;}

  if(action==='new-cat'){openNewCat();return;}
  if(action==='edit-cat'){openEditCat(t.dataset.id);return;}
  if(action==='cat-type'){
    sheet.type=t.dataset.type;
    document.getElementById('budgetField').style.display=sheet.type==='expense'?'block':'none';
    document.getElementById('primaryField').style.display=sheet.type==='income'?'block':'none';
    document.getElementById('fixedField').style.display=sheet.type==='expense'?'block':'none';
    document.querySelectorAll('.type-toggle button[data-action="cat-type"]').forEach(b=>b.classList.toggle('active-neutral',b.dataset.type===sheet.type));
    return;
  }
  if(action==='toggle-primary'){
    sheet.primary=!sheet.primary;
    document.getElementById('primarySwitch').classList.toggle('on',sheet.primary);
    return;
  }
  if(action==='toggle-fixed'){
    sheet.isFixed=!sheet.isFixed;
    document.getElementById('fixedSwitch').classList.toggle('on-violet',sheet.isFixed);
    return;
  }
  if(action==='pick-color'){
    sheet.color=t.dataset.color;
    document.querySelectorAll('#swatchList .swatch').forEach(s=>s.classList.toggle('selected',s.dataset.color===sheet.color));
    return;
  }
  if(action==='pick-icon'){
    sheet.icon=t.dataset.icon;
    document.querySelectorAll('#iconList .emoji-btn').forEach(b=>b.classList.toggle('selected',b.dataset.icon===sheet.icon));
    return;
  }
  if(action==='save-cat'){saveCatSheet();return;}
  if(action==='delete-cat'){confirmState={message:'Eliminar categoría.',onConfirm:()=>deleteCat(sheet.id)};renderOverlays();return;}

  if(action==='new-credit'){openNewCredit();return;}
  if(action==='edit-credit'){openEditCredit(t.dataset.id);return;}
  if(action==='credit-type'){
    sheet.type=t.dataset.type;
    renderOverlays();
    return;
  }
  if(action==='save-credit'){saveCreditSheet();return;}
  if(action==='delete-credit'){confirmState={message:'Eliminar este crédito.',onConfirm:()=>deleteCredit(sheet.id)};renderOverlays();return;}

  if(action==='new-payment'){openNewPayment(t.dataset.id);return;}
  if(action==='edit-payment'){openEditPayment(t.dataset.cid, t.dataset.pid);return;}
  if(action==='save-payment'){savePaymentSheet();return;}
  if(action==='delete-payment'){confirmState={message:'Eliminar este aporte.',onConfirm:()=>deletePayment(sheet.creditId, sheet.paymentId)};renderOverlays();return;}

  if(action==='scan-invoice'){openInvoiceScan();return;}
  if(action==='toggle-invoice'){UI.openInvoiceId = (UI.openInvoiceId===t.dataset.id)?null:t.dataset.id;render();return;}
  if(action==='edit-invoice'){openEditInvoice(t.dataset.id);return;}
  if(action==='register-invoice'){openRegisterInvoice(t.dataset.id);return;}
  if(action==='add-invoice-item'){sheet.items.push({id:uid(), name:'', price:''});refreshInvoiceItemsUI();return;}
  if(action==='remove-invoice-item'){
    const idx=Number(t.dataset.idx);
    sheet.items.splice(idx,1);
    if(!sheet.items.length) sheet.items.push({id:uid(), name:'', price:''});
    refreshInvoiceItemsUI();
    return;
  }
  if(action==='save-invoice'){saveInvoiceSheet();return;}
  if(action==='delete-invoice'){confirmState={message:'Eliminar esta factura.',onConfirm:()=>deleteInvoice(sheet.id)};renderOverlays();return;}

  if(action==='close-sheet'){sheet=null;renderOverlays();return;}
  if(action==='cancel-confirm'){confirmState=null;renderOverlays();return;}
  if(action==='confirm-ok'){const fn=confirmState.onConfirm;confirmState=null;fn();return;}

  if(action==='set-currency'){DB.settings.currency=t.dataset.code;saveDB();render();return;}
  if(action==='export-backup'){exportBackup();return;}
  if(action==='import-backup'){document.getElementById('import-file').click();return;}
  if(action==='reset-data'){
    confirmState={message:'Borrar todos los movimientos.',onConfirm:()=>{
      DB={transactions:[],categories:DEFAULT_CATEGORIES.slice(),credits:[],invoices:[],settings:{currency:DB.settings.currency, geminiApiKey:DB.settings.geminiApiKey}};
      saveDB();confirmState=null;render();
    }};
    renderOverlays();
    return;
  }
});

document.addEventListener('change',(e)=>{
  if(e.target.id==='import-file'&&e.target.files[0])importBackupFile(e.target.files[0]);
  if(e.target.id==='invoice-camera-input'&&e.target.files[0])handleInvoiceImage(e.target.files[0]);
});

render();
</script>
</body>
</html>
