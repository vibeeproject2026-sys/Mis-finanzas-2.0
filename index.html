<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terminal Cloud</title>
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
  <style>
    /* Bloqueo total de scroll horizontal y control estricto de la pantalla */
    html, body {
      overflow-x: hidden !important;
      width: 100%;
      max-width: 100vw;
      position: relative;
      touch-action: pan-y;
      box-sizing: border-box;
    }

    /* Asegurar que las vistas respeten los márgenes del headline */
    #view {
      width: 100%;
      box-sizing: border-box;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    
    .hero {
      max-width: 100%;
      box-sizing: border-box;
    }
    
    /* Barra de desplazamiento elegante, delgada y contenida dentro de los límites */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* Ocultar permanentemente cualquier botón de respaldo local en Ajustes por texto */
    button[data-action="export-backup"], 
    button[data-action="import-backup"] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <nav id="tabbar" class="tabbar"></nav>
  <div id="overlays"></div>
  <input type="file" id="import-file" style="display:none" accept=".json">
  <input type="file" id="global-camera-input" style="display:none" accept="image/*" capture="environment">

  <script type="module" src="./js/app.js"></script>
</body>
</html>
