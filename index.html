<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terminal Cloud</title>
  <link rel="stylesheet" href="./css/variables.css?v=20260916">
  <link rel="stylesheet" href="./css/main.css?v=20260916">
  <style>
    html, body { overflow-x:hidden !important; width:100%; max-width:100vw; position:relative; touch-action:pan-y; box-sizing:border-box; margin:0; padding:0; }
    #view { width:100%; box-sizing:border-box; padding-left:16px; padding-right:16px; }
    .hero { width:100%; box-sizing:border-box; margin-left:0; margin-right:0; }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.2); border-radius:8px; }
    button[data-action="export-backup"], button[data-action="import-backup"], button[data-action="reset-data"] { display:none !important; }
    #boot-error { display:none; min-height:100vh; box-sizing:border-box; padding:40px 20px; align-items:center; justify-content:center; background:#020408; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #boot-error-card { width:100%; max-width:520px; box-sizing:border-box; padding:24px; border-radius:24px; background:#0b1326; border:1px solid rgba(244,63,94,.45); box-shadow:0 20px 60px rgba(0,0,0,.5); }
    #boot-error-title { font-size:20px; font-weight:800; margin-bottom:10px; color:#ff4d6d; }
    #boot-error-message { font-size:13px; line-height:1.5; color:#cbd5e1; word-break:break-word; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div id="view"></div>
  <nav id="tabbar" class="tabbar"></nav>
  <div id="overlays"></div>
  <input type="file" id="import-file" style="display:none" accept=".json">
  <input type="file" id="global-camera-input" style="display:none" accept="image/*" capture="environment">
  <div id="boot-error">
    <div id="boot-error-card">
      <div id="boot-error-title">Error al iniciar Mis Finanzas</div>
      <div id="boot-error-message">Cargando la aplicación...</div>
    </div>
  </div>
  <script>
    (async function () {
      try {
        await import('./js/app.js?v=20260918-0100');
      } catch (error) {
        console.error('Error cargando Mis Finanzas:', error);
        document.getElementById('view').innerHTML = '';
        document.getElementById('tabbar').innerHTML = '';
        document.getElementById('overlays').innerHTML = '';
        document.getElementById('boot-error-message').textContent = error?.stack || error?.message || String(error);
        document.getElementById('boot-error').style.display = 'flex';
      }
    })();
  </script>
</body>
</html>
