<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terminal Cloud</title>
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/main.css">
  <style>
    /* Bloqueo estricto de scroll horizontal y control de márgenes seguros */
    html, body {
      overflow-x: hidden !important;
      width: 100%;
      max-width: 100vw;
      position: relative;
      touch-action: pan-y;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Margen lateral limpio para que las tarjetas no toquen los bordes de la pantalla */
    #view {
      width: 100%;
      box-sizing: border-box;
      padding-left: 16px;
      padding-right: 16px;
    }
    
    .hero {
      width: 100%;
      box-sizing: border-box;
      margin-left: 0;
      margin-right: 0;
    }
    
    /* Barra de desplazamiento elegante, fina y dentro de los límites */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
    }

    /* Ocultar botones no deseados en modo SaaS comercial (Exportar, Importar y Borrar Datos) */
    button[data-action="export-backup"], 
    button[data-action="import-backup"],
    button[data-action="reset-data"] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <nav id="tabbar" class="tabbar"></nav>
  <div id="overlays"></div>
  <input type="file" id="import-file" style="display:none" accept=".json">
  <input type="file" id="global-camera-input" style="display:none" accept="image/*" capture="environment">

  <script type="module" src="./js/app.js"></script>
</body>
</html>
