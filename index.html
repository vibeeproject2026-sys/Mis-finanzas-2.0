<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Mis Finanzas — Terminal Cloud</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<meta name="theme-color" content="#020408">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#020408; --card:rgba(11, 19, 38, 0.75); --card-alt:rgba(15, 23, 42, 0.7);
    --ink:#FFFFFF; --ink-muted:#94A3B8; --line:rgba(56, 189, 248, 0.25);
    --violet:#06B6D4; --violet-dark:#0284C7; --pink:#38BDF8;
    --income:#34D399; --income-bg:rgba(52, 211, 153, 0.15);
    --income2:#0EA5E9; --income2-bg:rgba(14, 165, 233, 0.15);
    --expense:#F43F5E; --expense-bg:rgba(244, 63, 94, 0.15);
    --amber:#F59E0B; --amber-bg:rgba(245, 158, 11, 0.15);
    --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    --border-glass: 1px solid rgba(56, 189, 248, 0.25);
    --glow-cyan: 0 0 20px rgba(6, 182, 212, 0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Outfit',-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;height:100%;}
  #root{max-width:480px;margin:0 auto;height:100dvh;height:100vh;position:relative;display:flex;flex-direction:column;}
  #view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1.5rem 1rem 8rem;position:relative;z-index:2;}
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;user-select:none;-webkit-user-select:none;}
  input, select{font-family:inherit;}
  .icon{width:1em;height:1em;display:inline-block;vertical-align:middle;}
  .icon svg{width:100%;height:100%;}

  /* Orbes de fondo ambiental Ciber-Glass */
  .orb{position:absolute;width:320px;height:320px;border-radius:160px;pointer-events:none;z-index:1;filter:blur(60px);}
  .orb-cyan{background:rgba(6, 182, 212, 0.18);top:10px;right:-80px;}
  .orb-blue{background:rgba(37, 99, 235, 0.2);bottom:80px;left:-80px;}

  .hero{
    position:relative;
    margin:0 -1rem 1.5rem;
    padding:1.8rem 1.4rem 1.5rem;
    background:rgba(11, 19, 38, 0.85);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-radius:0 0 28px 28px;
    color:#fff;
    border-bottom: var(--border-glass);
    box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2);
    overflow:hidden;
    z-index:2;
  }
  .hero-content{position:relative;z-index:2;}
  .hero-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(52, 211, 153, 0.12);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:4px 12px;
    border-radius:20px;
    font-size:10px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    border:1px solid rgba(52, 211, 153, 0.4);
    margin-bottom:12px;
    color:#34D399;
  }
  .hero-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#34D399;
    box-shadow:0 0 10px #34D399;
  }
  .hero-main{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .hero h1{font-size:26px;font-weight:800;letter-spacing:-0.5px;line-height:1.15;color:#FFFFFF;}
  .hero p{font-size:12px;color:var(--ink-muted);margin-top:4px;font-weight:500;}
  .hero-avatar{
    width:44px;height:44px;border-radius:16px;
    background:rgba(6, 182, 212, 0.15);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(6, 182, 212, 0.4);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;flex-shrink:0;box-shadow:var(--glow-cyan);
  }

  .banner{margin:0 0 .75rem;font-size:.75rem;border-radius:14px;padding:.65rem .8rem;}
  .banner--warn{background:var(--expense-bg);color:var(--expense);border:1px solid rgba(244,63,94,0.3);}

  .section-title{font-size:18px;font-weight:700;margin-bottom:16px;color:#FFFFFF;letter-spacing:-0.5px;}
  .empty-hint{font-size:12.5px;color:var(--ink-muted);padding:.4rem 0;}

  .balance-card{
    background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-radius:28px;padding:24px;box-shadow:var(--shadow);border:var(--border-glass);margin-bottom:16px;
  }
  .balance-label{color:var(--ink-muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;}
  .balance-amount{font-size:42px;font-weight:900;letter-spacing:-1.5px;margin-top:12px;text-shadow:0 0 25px rgba(6,182,212,0.25);}
  .balance-month{color:var(--ink-muted);font-size:11px;margin-top:2px;margin-bottom:20px;text-transform:capitalize;}

  .balance-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:16px;border-top:1px solid rgba(56, 189, 248, 0.2);}
  .b-metric{display:flex;flex-direction:column;gap:4px;background:rgba(2, 6, 23, 0.6);padding:14px;border-radius:20px;border:1px solid rgba(56, 189, 248, 0.2);}
  .b-metric .lbl{font-size:10px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;}
  .b-metric .val{font-size:14px;font-weight:800;}
  .b-metric .val.inc{color:var(--income);}
  .b-metric .val.exp{color:var(--expense);}
  .b-metric .val.sav{color:var(--violet);}

  .quick-grid{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 20px;justify-content:space-between;}
  .quick-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    width:30%;padding:16px 8px;border-radius:24px;
    background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:var(--shadow);border:var(--border-glass);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
    position:relative;overflow:hidden;
  }
  .quick-btn:hover {transform:translateY(-3px) scale(1.02);border-color:rgba(56, 189, 248, 0.6);box-shadow:var(--glow-cyan);}
  .quick-btn:active {transform:scale(0.92);}
  .quick-btn .em{font-size:28px;}
  .quick-btn .nm{font-size:11px;font-weight:600;text-align:center;line-height:1.2;color:#FFFFFF;word-break:break-word;}

  .card{
    border-radius:28px;padding:24px;background:var(--card);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:var(--shadow);margin-bottom:16px;border:var(--border-glass);
  }

  .burn-card{background:rgba(15, 23, 42, 0.8);border-radius:20px;padding:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(56, 189, 248, 0.25);}
  .burn-info{display:flex;flex-direction:column;gap:4px;}
  .burn-lbl{font-size:10px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:1px;}
  .burn-val{font-size:18px;font-weight:850;letter-spacing:-0.5px;}
  .burn-status{font-size:10px;font-weight:700;padding:6px 12px;border-radius:20px;text-transform:uppercase;}
  .burn-status.ok{background:rgba(52, 211, 153, 0.15);color:var(--income);border:1px solid rgba(52, 211, 153, 0.4);}
  .burn-status.warn{background:rgba(245, 158, 11, 0.15);color:var(--amber);border:1px solid rgba(245, 158, 11, 0.4);}
  .burn-status.alert{background:var(--expense-bg);color:var(--expense);border:1px solid rgba(244, 63, 94, 0.4);}

  .runway-card{background:rgba(2, 6, 23, 0.7);color:#fff;border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;margin-top:10px;border:1px solid rgba(56, 189, 248, 0.25);}
  .runway-icon{font-size:24px;background:rgba(6, 182, 212, 0.1);width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(6, 182, 212, 0.3);box-shadow:var(--glow-cyan);}
  .runway-main{flex:1;}
  .runway-lbl{font-size:10px;opacity:0.8;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink-muted);}
  .runway-val{font-size:15px;font-weight:800;margin-top:2px;}
  .runway-val span{color:var(--pink);font-size:16px;}

  .cat-row{margin-bottom:14px;}
  .cat-row .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;}
  .bar-track{height:8px;border-radius:4px;background:rgba(2, 6, 23, 0.8);margin-top:6px;overflow:hidden;border:1px solid rgba(56, 189, 248, 0.2);}
  .bar-fill{height:100%;border-radius:4px;transition:width 0.3s ease;}

  .pie-layout{display:flex;align-items:center;gap:18px;padding:5px 0 2px;}
  .pie-chart{width:130px;height:130px;flex:0 0 130px;position:relative;overflow:hidden;}
  .pie-chart svg{width:100%;height:100%;display:block;overflow:visible;}
  .pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;}
  .pie-center strong{font-size:16px;font-weight:900;color:var(--ink);line-height:1.1;letter-spacing:-0.5px;}
  .pie-center span{font-size:9px;color:var(--ink-muted);margin-top:2px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
  .pie-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .pie-legend-row{display:flex;align-items:center;gap:8px;min-width:0;}
  .pie-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
  .pie-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--ink-muted);}
  .pie-pct{font-size:12px;font-weight:800;flex-shrink:0;color:#FFFFFF;}

  /* ===== Comparativa Mes a Mes - Carrusel ===== */
  .mom-card{
    background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-radius:28px;padding:20px;border:var(--border-glass);margin-top:16px;overflow:hidden;box-shadow:var(--shadow);
  }
  .mom-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .mom-title{font-size:15px;font-weight:800;color:#FFFFFF;}
  .mom-dots{display:flex;gap:6px;}
  .mom-dot{width:6px;height:6px;border-radius:50%;background:rgba(56, 189, 248, 0.2);transition:background .3s;}
  .mom-dot.active{background:var(--violet);box-shadow:var(--glow-cyan);}
  .mom-carousel{position:relative;height:115px;overflow:hidden;}
  .mom-track{display:flex;transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);height:100%;}
  .mom-slide{min-width:100%;padding:0 2px;display:flex;flex-direction:column;justify-content:center;}
  .mom-slide-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mom-box{background:rgba(15, 23, 42, 0.8);padding:14px;border-radius:20px;border:1px solid rgba(56, 189, 248, 0.25);}
  .mom-box .lbl{font-size:10px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;}
  .mom-box .val{font-size:15px;font-weight:850;margin-top:4px;}
  .mom-box .delta{font-size:11px;font-weight:700;margin-top:2px;}
  .mom-box .delta.up{color:var(--expense);}
  .mom-box .delta.down{color:var(--income);}
  .mom-box .delta.neutral{color:var(--ink-muted);}
  .mom-single{background:rgba(15, 23, 42, 0.8);padding:16px;border-radius:20px;border:1px solid rgba(56, 189, 248, 0.25);text-align:center;}
  .mom-single .lbl{font-size:10px;color:var(--ink-muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;}
  .mom-single .val{font-size:24px;font-weight:900;margin-top:4px;letter-spacing:-0.5px;}
  .mom-single .sub{font-size:11px;color:var(--ink-muted);margin-top:4px;}
  .mom-insight{background:rgba(245, 158, 11, 0.12);border-radius:16px;padding:12px;font-size:12px;color:#FCD34D;line-height:1.4;display:flex;gap:10px;align-items:flex-start;margin-top:14px;border:1px solid rgba(245, 158, 11, 0.3);}

  .search-box{display:flex;align-items:center;gap:10px;border-radius:20px;padding:14px 18px;background:var(--card);backdrop-filter:blur(12px);box-shadow:var(--shadow);margin-bottom:14px;border:var(--border-glass);}
  .search-box input{flex:1;border:none;background:transparent;outline:none;font-size:14px;color:var(--ink);}

  .filter-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .chip{padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;background:var(--card);backdrop-filter:blur(12px);color:var(--ink-muted);box-shadow:var(--shadow);border:var(--border-glass);cursor:pointer;}
  .chip.selected{background:var(--violet);color:#020617;box-shadow:var(--glow-cyan);border-color:var(--pink);}

  .tx-item, .cat-item{width:100%;display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px;background:var(--card);backdrop-filter:blur(12px);box-shadow:var(--shadow);text-align:left;margin-bottom:12px;border:var(--border-glass);}
  .avatar{width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;border:1px solid rgba(56, 189, 248, 0.2);}
  .tx-main{flex:1;min-width:0;}
  .tx-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#FFFFFF;}
  .tx-sub{font-size:12px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .tx-amount{font-size:16px;font-weight:800;flex-shrink:0;}
  .tx-amount.income{color:var(--income);}
  .tx-amount.expense{color:var(--expense);}
  .empty-state{text-align:center;padding:3rem 0;color:var(--ink-muted);font-size:14px;}

  .new-cat-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:20px;padding:16px;background:var(--violet);color:#020617;font-size:15px;font-weight:800;margin-bottom:20px;box-shadow:var(--glow-cyan);}
  .cat-item .cat-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;color:#FFFFFF;}
  .cat-item .cat-budget{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .cat-item .cat-total{font-size:14px;font-weight:700;color:var(--ink-muted);margin-right:4px;}
  .star-badge{font-size:10px;background:var(--amber-bg);color:var(--amber);padding:3px 8px;border-radius:20px;font-weight:800;border:1px solid rgba(245, 158, 11, 0.4);}
  .fixed-badge{font-size:10px;background:rgba(6, 182, 212, 0.15);color:var(--violet);padding:3px 8px;border-radius:20px;font-weight:800;border:1px solid rgba(6, 182, 212, 0.4);}

  .credit-card{background:var(--card);backdrop-filter:blur(16px);border-radius:28px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;border:var(--border-glass);}
  .credit-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .credit-title{font-size:16px;font-weight:800;color:#FFFFFF;}
  .credit-sub{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .credit-values{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 6px;font-size:13px;color:var(--ink-muted);}
  .credit-pending{font-weight:900;font-size:18px;}
  .credit-pending.against{color:var(--expense);}
  .credit-pending.favor{color:var(--income);}
  .payment-item{display:flex;justify-content:space-between;align-items:center;background:rgba(15, 23, 42, 0.8);padding:10px 14px;border-radius:14px;font-size:12.5px;margin-top:8px;border:1px solid rgba(56, 189, 248, 0.2);}
  .add-pay-btn{width:100%;padding:12px;border-radius:16px;background:rgba(6, 182, 212, 0.12);color:var(--pink);font-weight:800;font-size:13px;margin-top:12px;text-align:center;border:1px solid rgba(56, 189, 248, 0.3);}

  .settings-list{border-radius:24px;padding:6px;background:var(--card);backdrop-filter:blur(16px);box-shadow:var(--shadow);border:var(--border-glass);}
  .settings-row{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:18px;font-size:14px;color:#FFFFFF;}
  .settings-row.active{background:rgba(56, 189, 248, 0.12);color:var(--pink);font-weight:700;}
  .data-box{border-radius:24px;padding:20px;background:var(--card);backdrop-filter:blur(16px);box-shadow:var(--shadow);font-size:14px;border:var(--border-glass);}
  .data-box .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(56, 189, 248, 0.1);}
  .data-box .row:last-child{border-bottom:none;}
  .data-box .row .muted{color:var(--ink-muted);}
  .danger-btn{width:100%;border-radius:20px;padding:16px;font-size:14px;font-weight:800;background:var(--expense-bg);color:var(--expense);margin-top:10px;border:1px solid rgba(244,63,94,0.4);}
  .secondary-btn{width:100%;border-radius:20px;padding:16px;font-size:14px;font-weight:800;background:var(--card);box-shadow:var(--shadow);margin-top:10px;border:var(--border-glass);color:#FFFFFF;}

  /* ===== Menú Inferior con Botón Central Flotante y Menú Desplegable ===== */
  .tabbar{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);
    width:100%;max-width:480px;z-index:90;
    display:flex;justify-content:space-around;align-items:center;
    background:rgba(11, 19, 38, 0.85);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(56, 189, 248, 0.35);
    padding-top:10px;padding-bottom:max(14px, env(safe-area-inset-bottom));
    box-shadow:0 -10px 30px rgba(2, 6, 23, 0.8);
  }
  .tab-btn{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;color:var(--ink-muted);transition:color 0.2s;}
  .tab-btn.active{color:var(--pink);text-shadow:0 0 10px rgba(56, 189, 248, 0.6);}
  .tab-btn .icon{width:22px;height:22px;}
  .tab-btn span{font-size:10px;font-weight:600;}
  .tab-btn.active span{font-weight:800;}

  /* Botón central flotante (+) */
  .center-fab-container {
    position: relative;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
  }
  .fab-center {
    position: absolute;
    bottom: 12px;
    width: 54px;
    height: 54px;
    border-radius: 27px;
    background: var(--violet);
    color: #020617;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 25px rgba(6, 182, 212, 0.8);
    border: 2px solid var(--pink);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
  }
  .fab-center:active {transform:scale(0.88);}
  .fab-center .icon { width: 26px; height: 26px; }

  /* Menú desplegable flotante al presionar el botón + */
  .fab-menu-backdrop {
    position: fixed; inset: 0; background: rgba(2, 4, 8, 0.7); backdrop-filter: blur(8px);
    z-index: 250; display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 90px; animation: fadeIn 0.2s ease;
  }
  .fab-menu-sheet {
    width: 90%; max-width: 420px; background: rgba(11, 19, 38, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 28px; padding: 18px;
    box-shadow: 0 0 40px rgba(6, 182, 212, 0.3); display: flex; flex-direction: column; gap: 10px;
    backdrop-filter: blur(20px); animation: slideUp 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .fab-menu-item {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px;
    background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.25);
    color: #FFFFFF; font-size: 15px; font-weight: 700; transition: background 0.2s, border-color 0.2s;
  }
  .fab-menu-item:hover { background: rgba(6, 182, 212, 0.15); border-color: var(--violet); }
  .fab-menu-item .icon-box {
    width: 36px; height: 36px; border-radius: 12px; background: rgba(6, 182, 212, 0.2);
    display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--pink);
    border: 1px solid rgba(56, 189, 248, 0.3);
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  <div class="orb orb-cyan"></div>

<script>
const STORAGE_KEY = 'finanzas_app_v2';

const SWATCHES = ['#06B6D4','#F43F5E','#F59E0B','#34D399','#0EA5E9','#38BDF8','#3B82F6','#A855F7','#EAB308','#64748B'];
const ICON_KEYS = ['food','transport','home','zap','heart','fun','shopping','briefcase','dollarSign','more'];
const ICON_EMOJI = {food:'🍔',transport:'🚗',home:'🏠',zap:'💡',heart:'❤',fun:'🎬',shopping:'🛍',briefcase:'💼',dollarSign:'💵',more:'⭐'};

const DEFAULT_CATEGORIES = [
  {id:'inc-salary',name:'Salario',type:'income',color:'#34D399',icon:'briefcase',primary:true},
  {id:'inc-sales',name:'Ventas',type:'income',color:'#0EA5E9',icon:'dollarSign',primary:false},
  {id:'inc-other',name:'Otros ingresos',type:'income',color:'#3B82F6',icon:'more',primary:false},
  {id:'exp-food',name:'Comida',type:'expense',color:'#F43F5E',icon:'food',budget:null,isFixed:false},
  {id:'exp-transport',name:'Transporte',type:'expense',color:'#F59E0B',icon:'transport',budget:null,isFixed:false},
  {id:'exp-home',name:'Hogar',type:'expense',color:'#A855F7',icon:'home',budget:null,isFixed:true},
  {id:'exp-services',name:'Servicios',type:'expense',color:'#3B82F6',icon:'zap',budget:null,isFixed:true},
  {id:'exp-health',name:'Salud',type:'expense',color:'#38BDF8',icon:'heart',budget:null,isFixed:false},
  {id:'exp-fun',name:'Entretenimiento',type:'expense',color:'#A855F7',icon:'fun',budget:null,isFixed:false},
  {id:'exp-shopping',name:'Compras',type:'expense',color:'#EAB308',icon:'shopping',budget:null,isFixed:false},
  {id:'exp-other',name:'Otros gastos',type:'expense',color:'#64748B',icon:'more',budget:null,isFixed:false},
];

const CURRENCIES = {
  COP:{locale:'es-CO',label:'Peso colombiano (COP)'},
  USD:{locale:'en-US',label:'Dólar (USD)'},
  MXN:{locale:'es-MX',label:'Peso mexicano (MXN)'},
  EUR:{locale:'es-ES',label:'Euro (EUR)'},
};

let storageOk = true;
try { localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); } catch(e) { storageOk = false; }

function loadDB(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const txs = (parsed.transactions || []).map(t => ({
        ...t, amount: Number(t.amount) || 0, date: (t.date && typeof t.date === 'string') ? t.date : todayStr()
      }));
      const credits = (parsed.credits || []).map(c => ({
        ...c, total: Number(c.total) || 0, payments: (c.payments || []).map(p => ({...p, amount: Number(p.amount) || 0}))
      }));
      const invoices = (parsed.invoices || []).map(inv => ({
        ...inv, total: Number(inv.total) || 0, items: (inv.items || []).map(it => ({...it, price: Number(it.price) || 0}))
      }));
      return {
        transactions: txs,
        categories: (parsed.categories && parsed.categories.length) ? parsed.categories : DEFAULT_CATEGORIES.slice(),
        credits: credits,
        invoices: invoices,
        settings: parsed.settings || {currency:'COP'},
      };
    }
  } catch(e){}
  return {transactions:[], categories:DEFAULT_CATEGORIES.slice(), credits:[], invoices:[], settings:{currency:'COP'}};
}

function saveDB(){
  if (!storageOk) return;
  try {
    const clean = {
      transactions: DB.transactions.map(t => ({...t, amount: Number(t.amount) || 0})),
      categories: DB.categories,
      credits: (DB.credits || []).map(c => ({...c, total: Number(c.total) || 0, payments: (c.payments || []).map(p => ({...p, amount: Number(p.amount) || 0}))})),
      invoices: (DB.invoices || []).map(inv => ({...inv, total: Number(inv.total) || 0, items: (inv.items || []).map(it => ({...it, price: Number(it.price) || 0}))})),
      settings: DB.settings
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clean));
  } catch(e){ storageOk = false; render(); }
}

let DB = loadDB();
let UI = {tab:'dashboard', txFilter:'all', creditFilter:'against', search:'', openInvoiceId:null, fabMenuOpen:false};
let sheet = null;
let confirmState = null;
let scanningOverlay = null;
let momSlideIndex = 0;
let momInterval = null;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function todayStr(){
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
}

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function formatThousandInput(val){
  const digits = String(val).replace(/\D/g, '');
  if (!digits) return '';
  return new Intl.NumberFormat('es-CO').format(digits);
}

function parseFormattedNumber(val){
  if (!val) return '';
  return String(val).replace(/\D/g, '');
}

function fmtMoney(amount){
  const cur = DB.settings.currency || 'COP';
  const cfg = CURRENCIES[cur] || CURRENCIES.COP;
  const n = Number(amount) || 0;
  try { return new Intl.NumberFormat(cfg.locale, {style:'currency', currency:cur, maximumFractionDigits:0}).format(n); }
  catch(e){ return n.toFixed(0) + ' ' + cur; }
}

function monthLabelStr(date){ return new Intl.DateTimeFormat('es-CO', {month:'long', year:'numeric'}).format(date); }
function catById(id){ return DB.categories.find(c => c.id === id); }
function getPrimaryIncomeCat(){ return DB.categories.find(c => c.type==='income' && c.primary) || null; }

const ICONS = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="4 12 9 17 20 6"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><line x1="16" y1="16" x2="21" y2="21"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 2 20h20L12 3z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17" r="0.8" fill="currentColor" stroke="none"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="17" cy="14" r="1.3" fill="currentColor" stroke="none"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>',
  tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3h6a2 2 0 0 1 2 2v6a2 2 0 0 1-.6 1.4l-8 8a2 2 0 0 1-2.8 0l-6-6a2 2 0 0 1 0-2.8l8-8A2 2 0 0 1 12 3z"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  credit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>',
  receipt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2v20l2-1.5L10 22l2-1.5L14 22l2-1.5L18 22V2l-2 1.5L14 2l-2 1.5L10 2 8 3.5 6 2z"/><line x1="8.5" y1="7.5" x2="15.5" y2="7.5"/><line x1="8.5" y1="11.5" x2="15.5" y2="11.5"/><line x1="8.5" y1="15.5" x2="13" y2="15.5"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></svg>',
};
const icon = (name, cls) => '<span class="icon ' + (cls||'') + '">' + ICONS[name] + '</span>';

function computeTotals(){
  let income=0, expense=0;
  DB.transactions.forEach(t => {
    const amt = Number(t.amount) || 0;
    if (t.type==='income') income += amt; else expense += amt;
  });
  return {income, expense, balance: income - expense};
}

function currentMonthTx(){
  const now = new Date();
  const localMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  return DB.transactions.filter(t => t.date && typeof t.date === 'string' && t.date.substring(0, 7) === localMonthKey);
}

function computeMonthStats(){
  const primary = getPrimaryIncomeCat();
  let primaryIncome=0, secondaryIncome=0, expense=0;
  currentMonthTx().forEach(t => {
    const amt = Number(t.amount) || 0;
    if (t.type==='income'){
      if (primary && t.categoryId === primary.id) primaryIncome += amt; else secondaryIncome += amt;
    } else { expense += amt; }
  });
  const income = primaryIncome + secondaryIncome;
  const netSavings = income - expense;
  const savingsRate = income > 0 ? Math.max(0, Math.round((netSavings / income) * 100)) : 0;
  return {primaryIncome, secondaryIncome, expense, income, netSavings, savingsRate};
}

function computeMonthOverMonthMetrics(){
  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth();
  const prevMDate = new Date(curY, curM - 1, 1);
  const prevMonthKey = `${prevMDate.getFullYear()}-${String(prevMDate.getMonth() + 1).padStart(2, '0')}`;
  const currentMonthKey = `${curY}-${String(curM + 1).padStart(2, '0')}`;

  let currentExpense = 0, prevExpense = 0, currentIncome = 0, prevIncome = 0;
  const currentCatMap = {}, prevCatMap = {};

  DB.transactions.forEach(t => {
    if (!t.date) return;
    const mKey = t.date.substring(0, 7), amt = Number(t.amount) || 0;
    if (mKey === currentMonthKey){
      if (t.type === 'expense') { currentExpense += amt; currentCatMap[t.categoryId] = (currentCatMap[t.categoryId] || 0) + amt; }
      else { currentIncome += amt; }
    } else if (mKey === prevMonthKey){
      if (t.type === 'expense') { prevExpense += amt; prevCatMap[t.categoryId] = (prevCatMap[t.categoryId] || 0) + amt; }
      else { prevIncome += amt; }
    }
  });

  const currentSavings = currentIncome - currentExpense, prevSavings = prevIncome - prevExpense;
  let expChangePct = prevExpense > 0 ? Math.round(((currentExpense - prevExpense) / prevExpense) * 100) : (currentExpense > 0 ? 100 : 0);
  let incChangePct = prevIncome > 0 ? Math.round(((currentIncome - prevIncome) / prevIncome) * 100) : (currentIncome > 0 ? 100 : 0);

  let highestGrowthCat = null, maxDiff = -Infinity;
  Object.keys(currentCatMap).forEach(catId => {
    const diff = currentCatMap[catId] - (prevCatMap[catId] || 0);
    if (diff > maxDiff && diff > 0){ maxDiff = diff; highestGrowthCat = catById(catId); }
  });

  const savingsRate = currentIncome > 0 ? Math.max(0, Math.round((currentSavings / currentIncome) * 100)) : 0;
  return { expChangePct, currentExpense, prevExpense, incChangePct, currentIncome, prevIncome, currentSavings, prevSavings, savingsRate, highestGrowthCat, maxDiff };
}

function computeCategoryTotals(){
  const map = {};
  currentMonthTx().forEach(t => {
    if (t.type === 'expense') map[t.categoryId] = (map[t.categoryId] || 0) + (Number(t.amount) || 0);
  });
  return Object.entries(map).map(([id, total]) => ({id, total, cat: catById(id)})).filter(r => r.cat).sort((a,b) => b.total - a.total);
}

function computeBurnMetrics(){
  const today = new Date();
  const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  const currentDay = today.getDate();
  const daysRemaining = Math.max(1, daysInMonth - currentDay + 1);
  const monthPctPassed = Math.round((currentDay / daysInMonth) * 100);

  const totals = computeTotals(), monthStats = computeMonthStats();
  const availableFunds = totals.balance > 0 ? totals.balance : Math.max(0, monthStats.income - monthStats.expense);
  const dailyAvailable = Math.max(0, availableFunds) / daysRemaining;

  const fixedCatIds = DB.categories.filter(c => c.isFixed || c.icon === 'home' || c.icon === 'zap' || (c.name||'').toLowerCase().includes('arriendo') || (c.name||'').toLowerCase().includes('servicio')).map(c => c.id);
  const isDailyExpense = t => t && t.type === 'expense' && !fixedCatIds.includes(t.categoryId) && !!t.date;

  const periodNumber = currentDay <= 10 ? 0 : (currentDay <= 20 ? 1 : 2);
  const periodStartDay = periodNumber === 0 ? 1 : (periodNumber === 1 ? 11 : 21);
  const periodEndDay = periodNumber === 0 ? 10 : (periodNumber === 1 ? 20 : daysInMonth);

  const currentPeriodDays = currentDay - periodStartDay + 1;
  const periodExpenses = [0, 0, 0];

  DB.transactions.forEach(t => {
    if (!isDailyExpense(t)) return;
    const tDate = new Date(t.date + 'T00:00:00');
    if (Number.isNaN(tDate.getTime()) || tDate.getFullYear() !== today.getFullYear() || tDate.getMonth() !== today.getMonth()) return;
    const day = tDate.getDate();
    if (day > currentDay) return;
    const p = day <= 10 ? 0 : (day <= 20 ? 1 : 2);
    periodExpenses[p] += Number(t.amount) || 0;
  });

  const currentPeriodExpense = periodExpenses[periodNumber];
  let avgDailyBurn = currentPeriodExpense > 0 ? currentPeriodExpense / currentPeriodDays : 0;
  if (avgDailyBurn <= 0) {
    for (let p = periodNumber - 1; p >= 0; p--) { if (periodExpenses[p] > 0) { avgDailyBurn = periodExpenses[p] / 10; break; } }
  }

  const runwayDays = (avgDailyBurn > 0 && totals.balance > 0) ? Math.floor(totals.balance / avgDailyBurn) : 0;
  return { daysRemaining, daysInMonth, currentDay, monthPctPassed, dailyAvailable, avgDailyBurn, currentPeriodExpense, currentPeriodDays, periodNumber, periodStartDay, periodEndDay, periodExpenses, runwayDays };
}

function computeBudgetRows(){
  const totals = computeCategoryTotals(), burn = computeBurnMetrics();
  return DB.categories.filter(c => c.type==='expense' && c.budget).map(c => {
    const spent = (totals.find(r => r.id===c.id) || {}).total || 0;
    const spentPct = Math.min(100, Math.round((spent / c.budget) * 100));
    const over = spent > c.budget, isPacingFast = !over && (spentPct > burn.monthPctPassed + 10);
    return {cat:c, spent, pct: spentPct, over, isPacingFast};
  });
}

function computeCreditsPaidThisMonth(){
  const now = new Date();
  const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  return (DB.credits || []).filter(c => c.type === 'against').reduce((sum, c) => {
    const monthlyPaid = (c.payments || []).filter(p => p.date && typeof p.date === 'string' && p.date.substring(0,7) === currentMonthKey).reduce((s,p) => s + (Number(p.amount)||0), 0);
    return sum + monthlyPaid;
  }, 0);
}

function expensePieSVG(catTotals, monthExpense, monthIncome, creditsPending){
  creditsPending = Number(creditsPending) || 0;
  if (!catTotals.length && creditsPending <= 0) return '';
  const cx = 60, cy = 60, r = 44, stroke = 16, circumference = 2 * Math.PI * r, gap = 3.2, usable = Math.max(0, circumference - gap);
  const base = (monthIncome > 0) ? monthIncome : (monthExpense + creditsPending);
  const remainingPct = (monthIncome > 0) ? Math.max(0, (monthIncome - monthExpense - creditsPending) / monthIncome) : 0;

  let offset = 0, slices = [];
  catTotals.forEach(rw => {
    const pct = Math.max(0, rw.total / base);
    if (pct <= 0) return;
    const rawDash = pct * usable, dash = Math.max(0, rawDash - gap * 0.15);
    slices.push({ color: rw.cat.color, dash, offset });
    offset += rawDash + (gap * 0.35);
  });
  if (creditsPending > 0 && base > 0) {
    const pct = Math.max(0, creditsPending / base), rawDash = pct * usable, dash = Math.max(0, rawDash - gap * 0.15);
    slices.push({ color: '#F43F5E', dash, offset });
    offset += rawDash + (gap * 0.35);
  }
  if (remainingPct > 0.005) {
    const rawDash = remainingPct * usable, dash = Math.max(0, rawDash - gap * 0.1);
    slices.push({ color: '#1E293B', dash, offset });
  }

  let svg = '<svg viewBox="0 0 120 120" aria-label="Gastos e ingresos">';
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#0F172A" stroke-width="'+stroke+'"/>';
  slices.forEach(s => {
    if (s.dash > 0.5) {
      svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="'+stroke+'" ' +
        'stroke-dasharray="'+s.dash.toFixed(2)+' '+(circumference - s.dash).toFixed(2)+'" ' +
        'stroke-dashoffset="'+(-s.offset).toFixed(2)+'" transform="rotate(-90 60 60)" stroke-linecap="butt" />';
    }
  });
  svg += '</svg>';
  return svg;
}

const GEMINI_MODELS_ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models';
const GEMINI_INVOICE_PROMPT = 'Analiza esta foto de una factura o recibo de compra. Devuelve ÚNICAMENTE un JSON con este formato exacto, sin texto adicional ni markdown: {"items":[{"name":"nombre del producto","price":12500}]}. Reglas: incluye solo los productos/artículos comprados; NO incluyas NIT, IVA, subtotal, total, cambio, efectivo, fecha, ni datos del establecimiento. Los precios deben ser números enteros en pesos, sin puntos, comas ni símbolos.';

async function callGeminiForInvoice(base64Data, mimeType){
  const apiKey = (DB.settings && DB.settings.geminiApiKey) ? DB.settings.geminiApiKey.trim() : '';
  if (!apiKey) throw new Error('Primero agrega tu clave de Gemini en Ajustes.');

  let available = [];
  try {
    const modelsResp = await fetch(GEMINI_MODELS_ENDPOINT + '?key=' + encodeURIComponent(apiKey));
    const modelsData = await modelsResp.json().catch(() => null);
    if (!modelsResp.ok) throw new Error('Tu clave de Gemini no es válida.');
    available = Array.isArray(modelsData && modelsData.models) ? modelsData.models : [];
  } catch(err){ throw new Error('No se pudo conectar con Gemini.'); }

  const supported = available.filter(m => {
    const name = String(m && (m.name || m.baseModelId || '')).replace(/^models\//, '');
    const methods = Array.isArray(m && m.supportedGenerationMethods) ? m.supportedGenerationMethods : [];
    return !!name && methods.includes('generateContent');
  });

  const candidates = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
  supported.forEach(s => candidates.push(s.name || s.baseModelId));

  const body = {
    contents: [{ role: 'user', parts: [{ text: GEMINI_INVOICE_PROMPT }, { inline_data: { mime_type: mimeType, data: base64Data } }] }],
    generationConfig: { responseMimeType: 'application/json' }
  };

  for (const modelName of candidates){
    const endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(modelName) + ':generateContent?key=' + encodeURIComponent(apiKey);
    try {
      const resp = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (resp.ok){
        const data = await resp.json();
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const parsed = JSON.parse(text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim());
        const rawItems = Array.isArray(parsed.items) ? parsed.items : [];
        return rawItems.map(it => ({ id: uid(), name: String(it.name || '').trim().slice(0,60) || 'Ítem', price: Math.round(Number(it.price)) || 0 })).filter(it => it.price > 0);
      }
    } catch(e){}
  }
  throw new Error('No se pudo procesar la factura con Gemini.');
}

async function handleInvoiceImage(file){
  scanningOverlay = {message:'Analizando factura con Gemini AI...'};
  renderOverlays();
  try {
    const reader = new FileReader();
    const dataUrl = await new Promise((res, rej) => {
      reader.onload = () => res(reader.result);
      reader.onerror = () => rej(new Error('Error al leer imagen'));
      reader.readAsDataURL(file);
    });
    const match = String(dataUrl).match(/^data:([^;]+);base64,(.*)$/);
    const items = await callGeminiForInvoice(match[2], match[1]);
    scanningOverlay = null;
    sheet = {
      kind:'invoice', mode:'new', id:null, title:'Factura ' + todayStr(), date:todayStr(),
      items: items.length ? items : [{id:uid(), name:'', price:''}], registered:false, categoryId:null, txId:null
    };
    renderOverlays();
  } catch(err){
    scanningOverlay = null; renderOverlays(); alert(err.message || 'Error al procesar la imagen.');
  }
}

function saveInvoiceSheet(){
  const items = sheet.items.filter(it => it.name.trim() && Number(it.price) > 0).map(it => ({id: it.id || uid(), name: it.name.trim().slice(0,60), price: Number(it.price)}));

function computeCreditsSummary(){
  let againstTotal = 0, againstPaidTotal = 0, againstCount = 0, favorTotal = 0, favorPaidTotal = 0, favorCount = 0;
  (DB.credits || []).forEach(c => {
    const total = Number(c.total) || 0, paidTotal = (c.payments || []).reduce((s,p) => s + (Number(p.amount)||0), 0);
    if (c.type === 'against'){ againstTotal += total; againstPaidTotal += paidTotal; againstCount += 1; }
    else if (c.type === 'favor'){ favorTotal += total; favorPaidTotal += paidTotal; favorCount += 1; }
  });
  return {
    againstTotal, againstPaidTotal, againstPending: Math.max(0, againstTotal - againstPaidTotal), againstProgressPct: againstTotal > 0 ? Math.min(100, Math.round((againstPaidTotal / againstTotal) * 100)) : 0, againstCount,
    favorTotal, favorPaidTotal, favorPending: Math.max(0, favorTotal - favorPaidTotal), favorProgressPct: favorTotal > 0 ? Math.min(100, Math.round((favorPaidTotal / favorTotal) * 100)) : 0, favorCount
  };
}

function renderCredits(){
  let html = '';
  const summary = computeCreditsSummary();
  if (summary.againstCount > 0 || summary.favorCount > 0){
    html += '<div class="balance-card">';
    if (summary.againstCount > 0){
      html += '<div class="balance-label">Total que debo</div>';
      html += '<div class="balance-amount" style="color:var(--expense)">' + fmtMoney(summary.againstPending) + '</div>';
      html += '<div class="balance-month">de ' + fmtMoney(summary.againstTotal) + ' en ' + summary.againstCount + ' crédito(s)</div>';
      html += '<div class="bar-track" style="margin-top:10px;"><div class="bar-fill" style="width:' + summary.againstProgressPct + '%;background:var(--income)"></div></div>';
    }
    if (summary.favorCount > 0){
      html += '<div style="margin-top:16px;padding-top:14px;border-top:1px solid rgba(56,189,248,0.2)">';
      html += '<div class="balance-label">Total que me deben</div>';
      html += '<div class="balance-amount" style="font-size:26px;color:var(--income)">' + fmtMoney(summary.favorPending) + '</div>';
      html += '<div class="balance-month">de ' + fmtMoney(summary.favorTotal) + ' en ' + summary.favorCount + ' cobro(s)</div></div>';
    }
    html += '</div>';
  }

  html += '<div class="filter-row" style="margin-bottom:14px;">';
  [['against','En contra (Deudas)'],['favor','A favor (Cobros)']].forEach(([val,label]) => {
    html += '<button class="chip ' + (UI.creditFilter===val?'selected':'') + '" data-action="set-credit-filter" data-filter="' + val + '">' + label + '</button>';
  });
  html += '</div>';

  const list = (DB.credits || []).filter(c => c.type === UI.creditFilter);
  if (!list.length) return html + '<div class="empty-state">No hay créditos registrados.</div>';

  list.forEach(c => {
    const totalPaid = (c.payments || []).reduce((sum, p) => sum + (Number(p.amount)||0), 0);
    const pending = Math.max(0, Number(c.total) - totalPaid);
    const pct = c.total > 0 ? Math.min(100, Math.round((totalPaid / c.total) * 100)) : 0;
    const isAgainst = c.type === 'against';

    html += '<div class="credit-card">';
    html += '<div class="credit-head"><div><div class="credit-title">' + esc(c.title) + '</div><div class="credit-sub">Total: ' + fmtMoney(c.total) + '</div></div><button data-action="edit-credit" data-id="' + c.id + '">' + icon('pencil') + '</button></div>';
    html += '<div class="credit-values"><span>Falta por ' + (isAgainst ? 'pagar' : 'cobrar') + ':</span><span class="credit-pending ' + (isAgainst ? 'against' : 'favor') + '">' + fmtMoney(pending) + '</span></div>';
    html += '<div class="bar-track" style="margin-bottom:12px;"><div class="bar-fill" style="width:' + pct + '%;background:' + (isAgainst?'var(--expense)':'var(--income)') + '"></div></div>';
    if (c.payments && c.payments.length){
      html += '<div style="margin-top:8px;"><span style="font-size:11px;font-weight:700;color:var(--ink-muted);">HISTORIAL:</span>';
      c.payments.forEach(p => {
        html += '<div class="payment-item"><span>' + esc(p.date) + (p.note ? ' - ' + esc(p.note) : '') + '</span><span><b>+' + fmtMoney(p.amount) + '</b> <button style="margin-left:6px" data-action="edit-payment" data-cid="' + c.id + '" data-pid="' + p.id + '">' + icon('pencil') + '</button></span></div>';
      });
      html += '</div>';
    }
    html += '<button class="add-pay-btn" data-action="new-payment" data-id="' + c.id + '">+ Agregar aporte</button></div>';
  });
  return html;
}

  const valid = Number(sheet.amount) > 0;
  return '<div class="overlay"><div class="sheet"><div class="sheet-handle"></div>' +
    '<div class="sheet-head"><h3>Registrar aporte</h3><button data-action="close-sheet">' + icon('close') + '</button></div>' +
    '<div class="field"><div class="field-label">Monto</div><input id="p-amount" type="text" inputmode="numeric" value="' + esc(formatThousandInput(sheet.amount)) + '"></div>' +
    '<div class="field"><div class="field-label">Fecha</div><input id="p-date" type="date" value="' + esc(sheet.date) + '"></div>' +
    '<div class="field"><div class="field-label">Nota</div><input id="p-note" value="' + esc(sheet.note) + '"></div>' +
    '<div class="sheet-actions"><button class="save-btn" id="pay-save-btn" data-action="save-payment" ' + (valid?'':'disabled') + '>Guardar aporte</button></div></div></div>';
}

function renderConfirmDialog(){
  return '<div class="overlay overlay-center"><div class="confirm-box"><p>' + esc(confirmState.message) + '</p>' +
    '<div class="confirm-actions"><button class="confirm-cancel" data-action="cancel-confirm">Cancelar</button><button class="confirm-ok" data-action="confirm-ok">Confirmar</button></div></div></div>';
}

function attachSheetFieldSync(){
  if (sheet.kind === 'tx'){
    const a = document.getElementById('f-amount'), d = document.getElementById('f-date'), n = document.getElementById('f-note');
    if (a) a.addEventListener('input', (e) => { sheet.amount = parseFormattedNumber(e.target.value); e.target.value = formatThousandInput(sheet.amount); refreshSaveState(); });
    if (d) d.addEventListener('input', () => { sheet.date = d.value; });
    if (n) n.addEventListener('input', () => { sheet.note = n.value; });
  } else if (sheet.kind === 'quick'){
    const a = document.getElementById('q-amount'), n = document.getElementById('q-note'), d = document.getElementById('q-date');
    if (a) a.addEventListener('input', (e) => { sheet.amount = parseFormattedNumber(e.target.value); e.target.value = formatThousandInput(sheet.amount); refreshSaveState(); });
    if (n) n.addEventListener('input', () => { sheet.note = n.value; });
    if (d) d.addEventListener('input', () => { sheet.date = d.value; });
  } else if (sheet.kind === 'cat'){
    const nm = document.getElementById('f-name'), b = document.getElementById('f-budget');
    if (nm) nm.addEventListener('input', () => { sheet.name = nm.value; refreshSaveState(); });
    if (b) b.addEventListener('input', (e) => { sheet.budget = parseFormattedNumber(e.target.value); e.target.value = formatThousandInput(sheet.budget); });
  } else if (sheet.kind === 'credit'){
    const t = document.getElementById('c-title'), tot = document.getElementById('c-total');
    if (t) t.addEventListener('input', () => { sheet.title = t.value; refreshSaveState(); });
    if (tot) tot.addEventListener('input', (e) => { sheet.total = parseFormattedNumber(e.target.value); e.target.value = formatThousandInput(sheet.total); refreshSaveState(); });
  } else if (sheet.kind === 'payment'){
    const a = document.getElementById('p-amount'), d = document.getElementById('p-date'), n = document.getElementById('p-note');
    if (a) a.addEventListener('input', (e) => { sheet.amount = parseFormattedNumber(e.target.value); e.target.value = formatThousandInput(sheet.amount); refreshSaveState(); });
    if (d) d.addEventListener('input', () => { sheet.date = d.value; });
    if (n) n.addEventListener('input', () => { sheet.note = n.value; });
  } else if (sheet.kind === 'invoice'){
    const ti = document.getElementById('inv-title'), da = document.getElementById('inv-date');
    if (ti) ti.addEventListener('input', () => { sheet.title = ti.value; });
    if (da) da.addEventListener('input', () => { sheet.date = da.value; });
    const list = document.getElementById('inv-items-list');
    if (list) list.addEventListener('input', (e) => {
      const idx = e.target.dataset.idx, field = e.target.dataset.field;
      if (idx === undefined || !field) return;
      if (field === 'price'){
        sheet.items[idx].price = parseFormattedNumber(e.target.value);
        e.target.value = formatThousandInput(sheet.items[idx].price);
      } else { sheet.items[idx][field] = e.target.value; }
      refreshInvoiceItemsUI();
    });
  }
}

function refreshSaveState(){
  if (sheet.kind === 'tx'){
    const btn = document.getElementById('tx-save-btn'); if (btn) btn.disabled = !(Number(sheet.amount) > 0 && sheet.categoryId);
  } else if (sheet.kind === 'quick'){
    const btn = document.getElementById('quick-save-btn'); if (btn) btn.disabled = !(Number(sheet.amount) > 0);
  } else if (sheet.kind === 'cat'){
    const btn = document.getElementById('cat-save-btn'); if (btn) btn.disabled = !(sheet.name.trim().length > 0);
  } else if (sheet.kind === 'credit'){
    const btn = document.getElementById('credit-save-btn'); if (btn) btn.disabled = !(sheet.title.trim().length > 0 && Number(sheet.total) > 0);
  } else if (sheet.kind === 'payment'){
    const btn = document.getElementById('pay-save-btn'); if (btn) btn.disabled = !(Number(sheet.amount) > 0);
  }
}

function openNewTx(){
  const firstExpense = DB.categories.find(c => c.type==='expense');
  sheet = {kind:'tx', mode:'new', id:null, type:'expense', categoryId:firstExpense?firstExpense.id:'', amount:'', date:todayStr(), note:''};
  renderOverlays();
}
function openEditTx(id){
  const t = DB.transactions.find(x => x.id===id);
  if (!t) return;
  sheet = {kind:'tx', mode:'edit', id:t.id, type:t.type, categoryId:t.categoryId, amount:String(Number(t.amount)||0), date:t.date, note:t.note||''};
  renderOverlays();
}
function openQuickAdd(catId){
  sheet = {kind:'quick', categoryId:catId, amount:'', note:'', date:todayStr(), showNote:false, showDate:false};
  renderOverlays();
}
function saveTxSheet(){
  const amount = Number(sheet.amount);
  if (!(amount > 0) || !sheet.categoryId) return;
  const tx = {id:sheet.id||uid(), type:sheet.type, amount: amount, categoryId:sheet.categoryId, date:sheet.date||todayStr(), note:(sheet.note||'').trim()};
  const exists = DB.transactions.some(t => t.id === tx.id);
  DB.transactions = exists ? DB.transactions.map(t => t.id===tx.id?tx:t) : DB.transactions.concat([tx]);
  if (sheet.sourceInvoiceId){
    DB.invoices = (DB.invoices||[]).map(inv => inv.id === sheet.sourceInvoiceId ? Object.assign({}, inv, {registered:true, categoryId:tx.categoryId, txId:tx.id}) : inv);
  }
  saveDB(); sheet=null; render();
}
function saveQuickSheet(){
  const amount = Number(sheet.amount);
  if (!(amount > 0)) return;
  const tx = {id:uid(), type:'expense', amount: amount, categoryId:sheet.categoryId, date:sheet.date||todayStr(), note:(sheet.note||'').trim()};
  DB.transactions = DB.transactions.concat([tx]);
  saveDB(); sheet=null; render();
}
function deleteTx(id){ DB.transactions = DB.transactions.filter(t=>t.id!==id); saveDB(); sheet=null; confirmState=null; render(); }
function openNewCat(){ sheet={kind:'cat',mode:'new',id:null,name:'',type:'expense',color:SWATCHES[0],icon:ICON_KEYS[0],budget:'',primary:false,isFixed:false}; renderOverlays(); }
function openEditCat(id){
  const c=catById(id); if (!c) return;
  sheet={kind:'cat',mode:'edit',id:c.id,name:c.name,type:c.type,color:c.color,icon:c.icon,budget:c.budget?String(c.budget):'',primary:!!c.primary,isFixed:!!c.isFixed};
  renderOverlays();
}
function saveCatSheet(){
  if (!sheet.name.trim()) return;
  const cat={id:sheet.id||uid(),name:sheet.name.trim(),type:sheet.type,color:sheet.color,icon:sheet.icon, budget:sheet.type==='expense'&&sheet.budget?Number(sheet.budget):null, primary:sheet.type==='income'?!!sheet.primary:false, isFixed:sheet.type==='expense'?!!sheet.isFixed:false};
  const exists=DB.categories.some(c=>c.id===cat.id);
  let next=exists?DB.categories.map(c=>c.id===cat.id?cat:c):DB.categories.concat([cat]);
  if (cat.primary) next=next.map(c=>c.id===cat.id?c:(c.type==='income'?Object.assign({},c,{primary:false}):c));
  DB.categories=next; saveDB(); sheet=null; render();
}
function deleteCat(id){ DB.categories=DB.categories.filter(c=>c.id!==id); saveDB(); sheet=null; confirmState=null; render(); }
function openNewCredit(){ sheet = {kind:'credit', mode:'new', id:null, title:'', type:UI.creditFilter||'against', total:''}; renderOverlays(); }
function openEditCredit(id){
  const c = (DB.credits||[]).find(x => x.id === id); if (!c) return;
  sheet = {kind:'credit', mode:'edit', id:c.id, title:c.title, type:c.type, total:String(Number(c.total)||0)};
  renderOverlays();
}
function saveCreditSheet(){
  const total = Number(sheet.total);
  if (!sheet.title.trim() || !(total > 0)) return;
  if (!DB.credits) DB.credits = [];
  const credit = {id: sheet.id || uid(), title: sheet.title.trim(), type: sheet.type, total: total, payments: sheet.id ? ((DB.credits.find(x => x.id === sheet.id)||{}).payments||[]) : []};
  const exists = DB.credits.some(c => c.id === credit.id);
  DB.credits = exists ? DB.credits.map(c => c.id === credit.id ? credit : c) : DB.credits.concat([credit]);
  saveDB(); sheet = null; render();
}
function deleteCredit(id){ DB.credits = (DB.credits||[]).filter(c => c.id !== id); saveDB(); sheet = null; confirmState = null; render(); }
function openNewPayment(creditId){ sheet = {kind:'payment', mode:'new', creditId:creditId, paymentId:null, amount:'', date:todayStr(), note:''}; renderOverlays(); }
function openEditPayment(creditId, paymentId){
  const c = (DB.credits||[]).find(x => x.id === creditId); if (!c) return;
  const p = (c.payments||[]).find(x => x.id === paymentId); if (!p) return;
  sheet = {kind:'payment', mode:'edit', creditId:creditId, paymentId:p.id, amount:String(Number(p.amount)||0), date:p.date, note:p.note||''};
  renderOverlays();
}
function savePaymentSheet(){
  const amount = Number(sheet.amount);
  if (!(amount > 0)) return;
  const p = {id: sheet.paymentId || uid(), amount: amount, date: sheet.date || todayStr(), note: (sheet.note||'').trim()};
  DB.credits = DB.credits.map(c => {
    if (c.id === sheet.creditId){
      let pays = c.payments || [];
      const exists = pays.some(x => x.id === p.id);
      pays = exists ? pays.map(x => x.id === p.id ? p : x) : pays.concat([p]);
      return Object.assign({}, c, {payments: pays});
    }
    return c;
  });
  saveDB(); sheet = null; render();
}
function deletePayment(creditId, paymentId){
  DB.credits = DB.credits.map(c => {
    if (c.id === creditId) return Object.assign({}, c, {payments: (c.payments||[]).filter(p => p.id !== paymentId)});
    return c;
  });
  saveDB(); sheet = null; confirmState = null; render();
}

function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='finanzas-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function importBackupFile(file){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed||!Array.isArray(parsed.transactions)||!Array.isArray(parsed.categories)) throw new Error();
      DB={
        transactions: (parsed.transactions||[]).map(t => ({...t, amount: Number(t.amount)||0})),
        categories: parsed.categories,
        credits: (parsed.credits||[]).map(c => ({...c, total: Number(c.total)||0, payments: (c.payments||[]).map(p => ({...p, amount: Number(p.amount)||0}))})),
        invoices: (parsed.invoices||[]).map(inv => ({...inv, total: Number(inv.total)||0, items: (inv.items||[]).map(it => ({...it, price: Number(it.price)||0}))})),
        settings: parsed.settings||{currency:'COP'}
      };
      saveDB(); render();
    }catch(err){alert('Copia de seguridad no válida.');}
  };
  reader.readAsText(file);
}

document.addEventListener('click',(e)=>{
  const t=e.target.closest('[data-action]');
  if(!t)return;
  const action=t.dataset.action;

  if(action==='set-tab'){UI.tab=t.dataset.tab;UI.fabMenuOpen=false;render();return;}
  if(action==='set-filter'){UI.txFilter=t.dataset.filter;refreshTxList();return;}
  if(action==='set-credit-filter'){UI.creditFilter=t.dataset.filter;render();return;}

  if(action==='toggle-fab-menu'){UI.fabMenuOpen=!UI.fabMenuOpen;render();return;}
  if(action==='close-fab-menu'){UI.fabMenuOpen=false;render();return;}

  if(action==='fab-new-tx'){UI.fabMenuOpen=false;openNewTx();return;}
  if(action==='fab-scan-invoice'){UI.fabMenuOpen=false;openInvoiceScan();return;}
  if(action==='fab-new-credit'){UI.fabMenuOpen=false;openNewCredit();return;}

  if(action==='edit-tx'){openEditTx(t.dataset.id);return;}
  if(action==='quick-cat'){openQuickAdd(t.dataset.id);return;}
  if(action==='show-note'){sheet.showNote=true;renderOverlays();return;}
  if(action==='show-date'){sheet.showDate=true;renderOverlays();return;}
  if(action==='save-quick'){saveQuickSheet();return;}

  if(action==='tx-type'){
    sheet.type=t.dataset.type;
    const firstOfType=DB.categories.find(c=>c.type===sheet.type);
    sheet.categoryId=firstOfType?firstOfType.id:'';
    renderOverlays(); return;
  }
  if(action==='pick-tx-cat'){
    sheet.categoryId=t.dataset.id;
    const chipContainer = document.getElementById('chipList');
    if(chipContainer){
      const cats = DB.categories.filter(c => c.type === sheet.type);
      chipContainer.innerHTML = renderTxCatChips(cats, sheet.categoryId);
    }
    refreshSaveState(); return;
  }
  if(action==='save-tx'){saveTxSheet();return;}
  if(action==='delete-tx'){confirmState={message:'¿Eliminar este movimiento?',onConfirm:()=>deleteTx(sheet.id)};renderOverlays();return;}

  if(action==='new-cat'){openNewCat();return;}
  if(action==='edit-cat'){openEditCat(t.dataset.id);return;}
  if(action==='cat-type'){
    sheet.type=t.dataset.type;
    document.getElementById('budgetField').style.display=sheet.type==='expense'?'block':'none';
    document.getElementById('primaryField').style.display=sheet.type==='income'?'block':'none';
    document.getElementById('fixedField').style.display=sheet.type==='expense'?'block':'none';
    document.querySelectorAll('.type-toggle button[data-action="cat-type"]').forEach(b=>b.classList.toggle('active-neutral',b.dataset.type===sheet.type));
    return;
  }
  if(action==='toggle-primary'){sheet.primary=!sheet.primary;document.getElementById('primarySwitch').classList.toggle('on',sheet.primary);return;}
  if(action==='toggle-fixed'){sheet.isFixed=!sheet.isFixed;document.getElementById('fixedSwitch').classList.toggle('on-violet',sheet.isFixed);return;}
  if(action==='pick-color'){
    sheet.color=t.dataset.color;
    document.querySelectorAll('#swatchList .swatch').forEach(s=>s.classList.toggle('selected',s.dataset.color===sheet.color));
    return;
  }
  if(action==='pick-icon'){
    sheet.icon=t.dataset.icon;
    document.querySelectorAll('#iconList .emoji-btn').forEach(b=>b.classList.toggle('selected',b.dataset.icon===sheet.icon));
    return;
  }
  if(action==='save-cat'){saveCatSheet();return;}
  if(action==='delete-cat'){confirmState={message:'¿Eliminar categoría?',onConfirm:()=>deleteCat(sheet.id)};renderOverlays();return;}

  if(action==='new-credit'){openNewCredit();return;}
  if(action==='edit-credit'){openEditCredit(t.dataset.id);return;}
  if(action==='credit-type'){sheet.type=t.dataset.type;renderOverlays();return;}
  if(action==='save-credit'){saveCreditSheet();return;}
  if(action==='delete-credit'){confirmState={message:'¿Eliminar este crédito?',onConfirm:()=>deleteCredit(sheet.id)};renderOverlays();return;}

  if(action==='new-payment'){openNewPayment(t.dataset.id);return;}
  if(action==='edit-payment'){openEditPayment(t.dataset.cid, t.dataset.pid);return;}
  if(action==='save-payment'){savePaymentSheet();return;}

  if(action==='toggle-invoice'){UI.openInvoiceId = (UI.openInvoiceId===t.dataset.id)?null:t.dataset.id;render();return;}
  if(action==='edit-invoice'){openEditInvoice(t.dataset.id);return;}
  if(action==='register-invoice'){openRegisterInvoice(t.dataset.id);return;}
  if(action==='add-invoice-item'){sheet.items.push({id:uid(), name:'', price:''});refreshInvoiceItemsUI();return;}
  if(action==='remove-invoice-item'){
    const idx=Number(t.dataset.idx); sheet.items.splice(idx,1);
    if(!sheet.items.length) sheet.items.push({id:uid(), name:'', price:''});
    refreshInvoiceItemsUI(); return;
  }
  if(action==='save-invoice'){saveInvoiceSheet();return;}
  if(action==='delete-invoice'){confirmState={message:'¿Eliminar esta factura?',onConfirm:()=>deleteInvoice(sheet.id)};renderOverlays();return;}

  if(action==='close-sheet'){sheet=null;renderOverlays();return;}
  if(action==='cancel-confirm'){confirmState=null;renderOverlays();return;}
  if(action==='confirm-ok'){const fn=confirmState.onConfirm;confirmState=null;fn();return;}

  if(action==='set-currency'){DB.settings.currency=t.dataset.code;saveDB();render();return;}
  if(action==='export-backup'){exportBackup();return;}
  if(action==='import-backup'){document.getElementById('import-file').click();return;}
  if(action==='reset-data'){
    confirmState={message:'¿Borrar todos los movimientos y datos?',onConfirm:()=>{
      DB={transactions:[],categories:DEFAULT_CATEGORIES.slice(),credits:[],invoices:[],settings:{currency:DB.settings.currency, geminiApiKey:DB.settings.geminiApiKey}};
      saveDB();confirmState=null;render();
    }};
    renderOverlays(); return;
  }
});

document.addEventListener('change',(e)=>{
  if(e.target.id==='import-file'&&e.target.files[0])importBackupFile(e.target.files[0]);
  if(e.target.id==='invoice-camera-input'&&e.target.files[0])handleInvoiceImage(e.target.files[0]);
});

render();
</script>
